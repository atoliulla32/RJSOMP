
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রক্তের রিকোয়েস্ট ম্যানেজমেন্ট | অ্যাডমিন প্যানেল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans Bengali', sans-serif; background: #f1f5f9; }</style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-6xl mx-auto pb-10">
        <!-- Header -->
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 flex justify-between items-center border-l-4 border-red-600">
            <div>
                <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-heartbeat text-red-600 mr-2"></i> রক্তের রিকোয়েস্ট প্যানেল</h1>
                <p class="text-sm text-gray-500 mt-1">ওয়েবসাইট থেকে আসা জরুরি রক্তের আবেদনসমূহ</p>
            </div>
            <a href="admin.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl font-bold text-sm transition">
                <i class="fas fa-arrow-left"></i> ড্যাশবোর্ড
            </a>
        </div>

        <!-- Request Grid -->
        <div id="requests_grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm">
                <i class="fas fa-spinner fa-spin text-3xl text-red-500 mb-3"></i>
                <p class="font-bold text-gray-500">রিকোয়েস্ট লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBB74MD8ZC1mUD787oqKqmXD-S4nb60yw", authDomain: "rjsomp.firebaseapp.com",
            projectId: "rjsomp", storageBucket: "rjsomp.firebasestorage.app", messagingSenderId: "1033528754332", appId: "1:1033528754332:web:a2dd02fc14096c1eeeed59"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.loadRequests = async () => {
            const grid = document.getElementById('requests_grid');
            try {
                const q = query(collection(db, "blood_requests"), orderBy("timestamp", "desc"));
                const snap = await getDocs(q);
                
                if(snap.empty) {
                    grid.innerHTML = `<div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm"><p class="text-gray-500 font-bold">কোনো নতুন রক্তের রিকোয়েস্ট নেই।</p></div>`;
                    return;
                }

                let html = '';
                snap.forEach(d => {
                    const req = d.data();
                    html += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-3 border-b pb-2">
                                    <span class="bg-red-100 text-red-700 text-xs font-bold px-2.5 py-1 rounded-md">জরুরি রিকোয়েস্ট</span>
                                    <a href="tel:${req.contactPhone}" class="bg-green-100 text-green-700 px-3 py-1 rounded-lg font-bold text-xs hover:bg-green-200 transition"><i class="fas fa-phone-alt"></i> কল করুন</a>
                                </div>
                                <h3 class="text-base font-bold text-gray-800 mb-1">যাঁর জন্য: <span class="text-red-600">${req.requestedDonor}</span></h3>
                                <div class="space-y-1.5 text-sm text-gray-600 font-medium my-3 bg-gray-50 p-3 rounded-xl">
                                    <p><i class="fas fa-user text-gray-400 w-5"></i> <b>রোগীর লোক:</b> ${req.patientName}</p>
                                    <p><i class="fas fa-phone text-green-500 w-5"></i> <b>নাম্বার:</b> ${req.contactPhone}</p>
                                    <p><i class="fas fa-hospital text-blue-500 w-5"></i> <b>হাসপাতাল:</b> ${req.hospital}</p>
                                </div>
                            </div>
                            <button onclick="deleteRequest('${d.id}')" class="w-full bg-red-50 text-red-600 hover:bg-red-600 hover:text-white border border-red-200 p-2.5 rounded-xl font-bold transition text-xs shadow-sm mt-2">
                                <i class="fas fa-trash-alt"></i> রিকোয়েস্ট ডিলিট করুন
                            </button>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            } catch(e) { grid.innerHTML = `<div class="col-span-full text-center py-10 text-red-500 font-bold">ডাটা লোড করতে সমস্যা হয়েছে!</div>`; }
        };

        window.deleteRequest = async (id) => {
            if(confirm("আপনি কি এই রিকোয়েস্টটি মুছে ফেলতে চান?")) {
                try {
                    await deleteDoc(doc(db, "blood_requests", id));
                    loadRequests();
                } catch(e) { alert("মুছতে সমস্যা হয়েছে!"); }
            }
        };

        loadRequests();
    </script>
</body>
</html>
