<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রক্তের রিকোয়েস্ট ম্যানেজমেন্ট | অ্যাডমিন প্যানেল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans Bengali', sans-serif; background: #f1f5f9; }</style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-7xl mx-auto pb-10">
        <!-- ================= হেডার ================= -->
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-start md:items-center border-l-4 border-red-600 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-heartbeat text-red-600 mr-2"></i> রক্তের রিকোয়েস্ট প্যানেল</h1>
                <p class="text-sm text-gray-500 mt-1">ওয়েবসাইট থেকে আসা জরুরি রক্তের আবেদনসমূহ ম্যানেজ করুন</p>
            </div>
            <a href="admin.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-5 py-2.5 rounded-xl font-bold text-sm transition shadow-sm flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> ড্যাশবোর্ড
            </a>
        </div>

        <!-- ================= কুইক ডোনার লুকআপ ================= -->
        <div class="bg-gradient-to-r from-red-50 to-white p-6 rounded-2xl shadow-sm mb-8 border border-red-100 relative overflow-hidden">
            <h2 class="text-lg font-bold text-gray-800 mb-2"><i class="fas fa-search-plus text-red-500 mr-1.5"></i> কুইক ডোনার লুকআপ</h2>
            <p class="text-xs text-gray-500 mb-4 font-medium">রিকোয়েস্ট থেকে পাওয়া <b class="text-gray-700">রক্তদাতার আইডি</b> এখানে পেস্ট করে ডোনারের নাম্বার ও বিস্তারিত তথ্য বের করুন।</p>
            
            <div class="flex gap-2">
                <input type="text" id="quickDonorId" placeholder="এখানে ডোনারের আইডি পেস্ট করুন..." class="flex-1 p-3 border border-gray-300 rounded-xl outline-none focus:border-red-500 text-sm font-mono bg-white">
                <button onclick="lookupDonor()" id="lookupBtn" class="bg-red-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-red-700 transition shadow-sm text-sm shrink-0">
                    <i class="fas fa-search"></i> খুঁজুন
                </button>
            </div>
            
            <!-- লুকআপ রেজাল্ট -->
            <div id="lookupResult" class="mt-4 hidden transition-all"></div>
        </div>

        <!-- ================= সার্চ ও ফিল্টার সেকশন ================= -->
        <div class="bg-white p-5 rounded-2xl shadow-sm mb-8 border border-gray-100">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2 relative">
                    <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wider">সার্চ করুন (আইডি / নাম / হাসপাতাল)</label>
                    <i class="fas fa-search absolute left-3 bottom-3.5 text-gray-400"></i>
                    <input type="text" id="searchBox" onkeyup="filterRequests()" placeholder="ইউনিক আইডি, নাম বা ঠিকানা লিখুন..." class="w-full pl-9 pr-3 py-2.5 border border-gray-300 rounded-xl outline-none focus:border-red-500 bg-gray-50 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wider">রক্তের গ্রুপ দিয়ে খুঁজুন</label>
                    <select id="bgFilter" onchange="filterRequests()" class="w-full p-2.5 border border-gray-300 rounded-xl outline-none focus:border-red-500 bg-gray-50 text-sm font-bold text-red-600 cursor-pointer">
                        <option value="all">সব রক্তের গ্রুপ</option>
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wider">তারিখ দিয়ে খুঁজুন</label>
                    <div class="flex gap-2">
                        <input type="date" id="dateFilter" onchange="filterRequests()" class="w-full p-2.5 border border-gray-300 rounded-xl outline-none focus:border-red-500 bg-gray-50 text-sm font-medium text-gray-700 cursor-pointer">
                        <button onclick="resetFilter()" class="bg-gray-200 text-gray-600 px-3 rounded-xl hover:bg-gray-300 transition" title="ফিল্টার মুছুন"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= রিকোয়েস্ট গ্রিড ================= -->
        <div id="requests_grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm border border-gray-100">
                <i class="fas fa-spinner fa-spin text-4xl text-red-500 mb-3"></i>
                <p class="font-bold text-gray-500">ডাটাবেজ থেকে রিকোয়েস্ট লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBB74MD8ZC1mUD787oqKqmXD-S4nb60yw", authDomain: "rjsomp.firebaseapp.com",
            projectId: "rjsomp", storageBucket: "rjsomp.firebasestorage.app", messagingSenderId: "1033528754332", appId: "1:1033528754332:web:a2dd02fc14096c1eeeed59"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.allRequests = [];

        window.loadRequests = async () => {
            const grid = document.getElementById('requests_grid');
            try {
                const q = query(collection(db, "blood_requests"), orderBy("timestamp", "desc"));
                const snap = await getDocs(q);
                window.allRequests = [];
                snap.forEach(d => { window.allRequests.push({ id: d.id, data: d.data() }); });
                renderRequests(window.allRequests);
            } catch(e) { 
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-red-500 font-bold bg-white rounded-2xl">ডাটা লোড করতে সমস্যা হয়েছে!</div>`; 
            }
        };

        window.renderRequests = (requestsArray) => {
            const grid = document.getElementById('requests_grid');
            if(requestsArray.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm border border-gray-100"><i class="fas fa-folder-open text-4xl text-gray-300 mb-3"></i><p class="text-gray-500 font-bold text-lg">কোনো রক্তের রিকোয়েস্ট পাওয়া যায়নি!</p></div>`;
                return;
            }

            let html = '';
            requestsArray.forEach(item => {
                const req = item.data;
                const id = item.id;
                
                let dateTimeStr = "সময় জানা যায়নি";
                if (req.timestamp && req.timestamp.toDate) {
                    const d = req.timestamp.toDate();
                    dateTimeStr = d.toLocaleString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: 'numeric', hour12: true });
                }

                // আসল ডোনার আইডি থাকলে সবুজ, না থাকলে (পুরাতন রিকোয়েস্ট) লাল দেখাবে
                const displayId = req.donorId ? req.donorId : id;
                const badgeHtml = req.donorId 
                    ? `<span class="text-[10px] font-bold text-emerald-700">রক্তদাতার আইডি: <span class="font-mono text-gray-800 cursor-pointer hover:text-emerald-600" onclick="copyId('${displayId}')">${displayId}</span></span>
                       <button onclick="copyId('${displayId}')" class="text-emerald-600 hover:text-emerald-800"><i class="far fa-copy"></i></button>`
                    : `<span class="text-[10px] font-bold text-red-600">পুরাতন রিকোয়েস্ট আইডি: <span class="font-mono text-gray-800 cursor-pointer hover:text-red-600" onclick="copyId('${displayId}')">${displayId}</span></span>
                       <button onclick="copyId('${displayId}')" class="text-red-600 hover:text-red-800"><i class="far fa-copy"></i></button>`;

                html += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <div class="flex justify-between items-center mb-3 border-b border-gray-100 pb-3">
                                <span class="bg-red-50 text-red-600 text-[10px] font-bold px-2 py-1 rounded border border-red-100"><i class="fas fa-exclamation-circle"></i> ইমারজেন্সি</span>
                                <span class="text-xs font-bold text-gray-500"><i class="far fa-clock text-blue-400"></i> ${dateTimeStr}</span>
                            </div>
                            
                            <h3 class="text-[15px] font-bold text-gray-800 mb-2 leading-tight">ডোনার: <span class="text-red-600">${req.requestedDonor}</span></h3>
                            
                            <div class="space-y-2 text-[13px] text-gray-700 font-medium my-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                <p class="flex items-start gap-2"><i class="fas fa-hospital text-blue-500 mt-1 shrink-0 w-4"></i> <span><b>ঠিকানা/সমস্যা:</b> ${req.hospital}</span></p>
                                <p class="flex items-start gap-2"><i class="fas fa-user text-gray-500 mt-1 shrink-0 w-4"></i> <span><b>রোগীর লোক:</b> ${req.patientName}</span></p>
                                <p class="flex items-start gap-2"><i class="fas fa-phone-alt text-green-500 mt-1 shrink-0 w-4"></i> <span><b>মোবাইল:</b> ${req.contactPhone}</span></p>
                            </div>
                            
                            <!-- আইডি কপি সেকশন -->
                            <div class="bg-yellow-50 px-3 py-2 rounded-lg border border-yellow-200 mb-4 flex justify-between items-center">
                                ${badgeHtml}
                            </div>
                        </div>

                        <div class="flex gap-2 mt-auto">
                            <a href="tel:${req.contactPhone}" class="flex-1 bg-green-500 hover:bg-green-600 text-white p-2.5 rounded-xl font-bold transition text-xs shadow-sm flex items-center justify-center gap-1.5">
                                <i class="fas fa-phone-alt"></i> কল
                            </a>
                            <button onclick="deleteRequest('${id}')" class="flex-1 bg-red-50 hover:bg-red-600 text-red-600 hover:text-white border border-red-200 hover:border-red-600 p-2.5 rounded-xl font-bold transition text-xs shadow-sm flex items-center justify-center gap-1.5">
                                <i class="fas fa-trash-alt"></i> ডিলিট
                            </button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        };

        // ================= ২. কুইক ডোনার লুকআপ (Auto-Clear System) =================
        window.lookupDonor = async () => {
            const inputField = document.getElementById('quickDonorId');
            const id = inputField.value.trim();
            const resDiv = document.getElementById('lookupResult');
            const btn = document.getElementById('lookupBtn');

            if(!id) return alert("দয়া করে সিস্টেম আইডি দিন!");

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;

            try {
                const docRef = doc(db, "blood_donors", id);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const d = docSnap.data();
                    resDiv.innerHTML = `
                        <div class="bg-white p-4 rounded-xl border-2 border-emerald-400 shadow-lg mt-2 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h3 class="text-lg font-bold text-gray-800">${d.name} <span class="bg-red-100 text-red-600 text-xs px-2 py-0.5 rounded ml-2 border border-red-200">${d.bloodGroup}</span></h3>
                                <p class="text-sm text-gray-600 mt-1"><i class="fas fa-map-marker-alt text-red-400 w-4"></i> ${d.village || ''}, ${d.upazila || ''}, ${d.district || 'ঠিকানা নেই'}</p>
                                <p class="text-sm text-gray-600 mt-0.5"><i class="fas fa-history text-blue-400 w-4"></i> শেষ রক্তদান: ${d.lastDonation || 'জানা নেই'}</p>
                                <p class="text-sm font-bold text-gray-800 mt-2.5 bg-yellow-100 px-3 py-1.5 rounded inline-block border border-yellow-300">গোপন কোড (PIN): <span class="tracking-widest text-red-600 ml-1">${d.secretPin || 'নাই'}</span></p>
                            </div>
                            <div class="flex flex-col gap-2 w-full md:w-auto shrink-0">
                                <a href="tel:${d.phone}" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold transition text-sm flex items-center justify-center gap-2 shadow-sm">
                                    <i class="fas fa-phone-alt"></i> ${d.phone}
                                </a>
                            </div>
                        </div>
                    `;
                    resDiv.classList.remove('hidden');
                } else {
                    // 🔴 যদি ডোনার না পাওয়া যায়: এরর মেসেজ দেখাবে এবং বক্স রিসেট হয়ে যাবে
                    resDiv.innerHTML = `<div class="bg-red-50 p-4 rounded-xl border border-red-200 text-center"><p class="text-red-600 font-bold"><i class="fas fa-times-circle text-lg mr-1"></i> এই আইডিতে কোনো ডোনার পাওয়া যায়নি!</p></div>`;
                    resDiv.classList.remove('hidden');
                    
                    inputField.value = ''; // বক্স খালি করে দেওয়া
                    
                    setTimeout(() => { resDiv.classList.add('hidden'); }, 3000); // ৩ সেকেন্ড পর লাল মেসেজ মুছে যাবে
                }
            } catch(e) {
                resDiv.innerHTML = `<p class="text-red-500 font-bold mt-3">সমস্যা হয়েছে! আবার চেষ্টা করুন。</p>`;
                resDiv.classList.remove('hidden');
            } finally {
                btn.innerHTML = '<i class="fas fa-search"></i> খুঁজুন'; btn.disabled = false;
            }
        };

        window.filterRequests = () => {
            const searchTxt = document.getElementById('searchBox').value.toLowerCase();
            const bgVal = document.getElementById('bgFilter').value;
            const dateVal = document.getElementById('dateFilter').value; 

            const filteredData = window.allRequests.filter(item => {
                const req = item.data;
                const searchString = `${req.hospital} ${req.patientName} ${req.requestedDonor} ${req.contactPhone}`.toLowerCase();
                const matchesSearch = searchString.includes(searchTxt);

                let matchesBg = true;
                if(bgVal !== 'all') { matchesBg = req.requestedDonor && req.requestedDonor.includes(`(${bgVal})`); }

                let matchesDate = true;
                if(dateVal) {
                    if(req.timestamp && req.timestamp.toDate) {
                        const d = req.timestamp.toDate();
                        const localISODate = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                        matchesDate = (localISODate === dateVal);
                    } else { matchesDate = false; }
                }

                return matchesSearch && matchesBg && matchesDate;
            });
            renderRequests(filteredData);
        };

        window.resetFilter = () => {
            document.getElementById('searchBox').value = '';
            document.getElementById('bgFilter').value = 'all';
            document.getElementById('dateFilter').value = '';
            renderRequests(window.allRequests);
        };

        window.copyId = (id) => { navigator.clipboard.writeText(id).then(() => { alert("আইডি কপি করা হয়েছে!"); }); };

        window.deleteRequest = async (id) => {
            if(confirm("আপনি কি নিশ্চিত? ডিলিট করলে এটি আর ফিরে পাওয়া যাবে না।")) {
                try {
                    await deleteDoc(doc(db, "blood_requests", id));
                    window.allRequests = window.allRequests.filter(item => item.id !== id);
                    filterRequests(); 
                } catch(e) { alert("মুছতে সমস্যা হয়েছে!"); }
            }
        };

        loadRequests();
    </script>
</body>
</html>
