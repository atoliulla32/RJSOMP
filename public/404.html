<!DOCTYPE html>

    <!-- Tailwind CSS -->

    <style>

            0% { transform: translateY(0px); }

<body class="bg-gray-950 text-gray-100 font-sans antialiased flex flex-col min-h-screen justify-center items-center p-4 relative overflow-hidden">

        </p>

        <div class="space-y-3">

            <a href="about.html" class="w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-3 px-6 rounded-2xl transition-all duration-300 text-sm">
