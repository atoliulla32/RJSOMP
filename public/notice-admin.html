<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিজ্ঞপ্তি অ্যাডমিন প্যানেল | রক্তযোদ্ধা</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; background: #f1f5f9; padding: 20px; margin: 0; }
        .admin-container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #dc2626; text-align: center; border-bottom: 2px solid #dc2626; padding-bottom: 10px; margin-top: 0; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; box-sizing: border-box; font-size: 14px;}
        .form-group input:focus, .form-group textarea:focus { border-color: #dc2626; outline: none; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; background: #fef2f2; padding: 10px; border-radius: 8px; border: 1px solid #fecaca; cursor: pointer;}
        .checkbox-group input { width: 20px; height: 20px; cursor: pointer; }
        .checkbox-group label { margin: 0; font-weight: bold; color: #dc2626; cursor: pointer; }

        .btn-group { display: flex; gap: 10px; width: 100%; }
        button.submit-btn { flex: 1; background: #dc2626; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s;}
        button.submit-btn:hover { background: #b91c1c; }
        
        #cancelBtn { background: #64748b; }
        #cancelBtn:hover { background: #475569; }

        .notice-list { margin-top: 40px; }
        .n-item { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e2e8f0; position: relative;}
        .n-item.live-active { border-left: 5px solid #b91c1c; background: #fff5f5; }
        
        .n-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;}
        .n-title { margin: 0; color: #1e293b; font-size: 16px; font-weight: bold;}
        .n-date { font-size: 12px; color: #64748b; }
        .live-badge { background: #b91c1c; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-top: 5px;}
        
        .n-actions { display: flex; gap: 10px; border-top: 1px dashed #cbd5e1; padding-top: 10px; margin-top: 10px; flex-wrap: wrap;}
        .action-btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; font-size: 13px; flex: 1; transition: 0.2s; min-width: 80px;}
        .btn-live { background: #f59e0b; color: white; }
        .btn-live.active { background: #475569; color: white; }
        .btn-edit { background: #3b82f6; color: white; }
        .btn-edit:hover { background: #2563eb; }
        .btn-del { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div id="admin-login-box" class="admin-container" style="max-width: 400px; margin: 100px auto; text-align: center; display: none;">
        <h2 style="color: #dc2626; border-bottom: 2px solid #dc2626; padding-bottom: 10px; margin-top: 0;">অ্যাডমিন লগইন</h2>
        <div class="form-group" style="margin-top: 20px; text-align: left;">
            <label>অ্যাডমিন ইমেইল</label>
            <input type="email" id="admin-email" placeholder="ইমেইল লিখুন...">
        </div>
        <div class="form-group" style="text-align: left;">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="admin-pass" placeholder="পাসওয়ার্ড লিখুন...">
        </div>
        <button onclick="verifyAdmin()" class="submit-btn" style="width: 100%; margin-top: 10px;">লগইন করুন</button>
        <p id="admin-err" style="color: #ef4444; font-weight: bold; margin-top: 15px; display: none; background: #fef2f2; padding: 10px; border-radius: 8px; border: 1px solid #fee2e2; font-size: 14px;"></p>
    </div>

    <div id="admin-dashboard" class="admin-container" style="display: none;">
        <button onclick="logoutAdmin()" class="action-btn btn-del" style="float: right; max-width: 120px; padding: 8px 16px; margin-bottom: 20px; font-weight: bold; border-radius: 8px;">লগআউট</button>
        <div style="clear: both;"></div>
        
        <h2 id="formTitle">নতুন বিজ্ঞপ্তি যুক্ত করুন</h2>
        
        <div class="form-group">
            <label>বিজ্ঞপ্তির শিরোনাম</label>
            <input type="text" id="nTitle" placeholder="শিরোনাম লিখুন...">
        </div>
        <div class="form-group">
            <label>তারিখ বা সাব-টাইটেল</label>
            <input type="text" id="nDate" placeholder="যেমন: ০৭ মে ২০২৬">
        </div>
        <div class="form-group">
            <label>স্মারক নং (অটোমেটিক তৈরি হয়েছে, চাইলে পরিবর্তন করতে পারেন)</label>
            <input type="text" id="nSmk" style="background: #f1f5f9; font-weight: bold; color: #dc2626;">
        </div>
        <div class="form-group">
            <label>বিস্তারিত বিবরণ</label>
            <textarea id="nDesc" rows="4" placeholder="বিজ্ঞপ্তির বিস্তারিত লিখুন..."></textarea>
        </div>
        
        <label class="checkbox-group">
            <input type="checkbox" id="nIsLive" checked>
            <span>পাবলিশ করার সাথেই উপরের বোর্ডে 'লাইভ' হিসেবে দেখান</span>
        </label>

        <div class="btn-group">
            <button onclick="saveNotice()" class="submit-btn" id="submitBtn">পাবলিশ করুন</button>
            <button onclick="cancelEdit()" class="submit-btn" id="cancelBtn" style="display:none;">এডিট বাতিল</button>
        </div>

        <div class="notice-list">
            <h3 style="color: #dc2626; border-bottom: 2px solid #dc2626; padding-bottom: 5px;">নিয়ন্ত্রণ প্যানেল (Control Panel)</h3>
            <div id="adminNoticeList">
                <p>লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // RJSOMP Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDBB74MD8ZC1mUD787oqKqmXD-S4nb60yw",
            authDomain: "rjsomp.firebaseapp.com",
            projectId: "rjsomp",
            storageBucket: "rjsomp.firebasestorage.app",
            messagingSenderId: "1033528754332",
            appId: "1:1033528754332:web:a2dd02fc14096c1eeeed59"
        };
        const app = initializeApp(firebaseConfig);
        
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
        });
        const auth = getAuth(app);

        let editingId = null; 
        let allAdminNotices = []; 

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('admin-login-box').style.display = 'none'; 
                document.getElementById('admin-dashboard').style.display = 'block'; 
                initRealtimeListener();
            } else {
                document.getElementById('admin-login-box').style.display = 'block'; 
                document.getElementById('admin-dashboard').style.display = 'none';
            }
        });

        window.verifyAdmin = async function() { 
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            const errBox = document.getElementById('admin-err');
            
            if(!email || !pass) { errBox.innerText = "ইমেইল ও পাসওয়ার্ড দিন!"; errBox.style.display = 'block'; return; }
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                errBox.style.display = 'none';
            } catch (error) {
                errBox.innerText = "ভুল ইমেইল বা পাসওয়ার্ড!"; errBox.style.display = 'block'; 
            }
        }

        window.logoutAdmin = async function() {
            if(confirm("আপনি কি লগআউট করতে চান?")) {
                await signOut(auth);
                window.location.reload();
            }
        }

        function generateAutoSmk() {
            return "RJSOMP/26/" + (Math.floor(Math.random() * 9000) + 1000);
        }
        document.getElementById('nSmk').value = generateAutoSmk();

        window.saveNotice = async function() {
            const title = document.getElementById('nTitle').value;
            const date = document.getElementById('nDate').value;
            const smk = document.getElementById('nSmk').value; 
            const desc = document.getElementById('nDesc').value;
            const isLive = document.getElementById('nIsLive').checked;
            const btn = document.getElementById('submitBtn');

            if(!title || !date || !desc || !smk) { alert("সব তথ্য পূরণ করুন!"); return; }

            btn.innerText = editingId ? "আপডেট হচ্ছে..." : "পাবলিশ হচ্ছে...";
            
            const noticeData = { title: title, date: date, smk: smk, description: desc, isLive: isLive };

            try {
                if(editingId) {
                    await updateDoc(doc(db, "notices", editingId), noticeData);
                    alert("বিজ্ঞপ্তি সফলভাবে আপডেট হয়েছে!");
                    cancelEdit();
                } else {
                    noticeData.timestamp = Date.now();
                    await addDoc(collection(db, "notices"), noticeData);
                    alert("সফলভাবে পাবলিশ হয়েছে!");
                    cancelEdit();
                }
            } catch(e) {
                alert("সমস্যা: " + e.message);
                cancelEdit();
            }
        }

        window.cancelEdit = function() {
            editingId = null;
            document.getElementById('formTitle').innerText = "নতুন বিজ্ঞপ্তি যুক্ত করুন";
            document.getElementById('nTitle').value = '';
            document.getElementById('nDate').value = '';
            document.getElementById('nDesc').value = '';
            document.getElementById('nSmk').value = generateAutoSmk();
            document.getElementById('nIsLive').checked = true;
            
            document.getElementById('submitBtn').innerText = "পাবলিশ করুন";
            document.getElementById('cancelBtn').style.display = "none";
        }

        window.editNotice = function(id) {
            const notice = allAdminNotices.find(n => n.id === id);
            if(notice) {
                editingId = id;
                document.getElementById('formTitle').innerText = "বিজ্ঞপ্তি এডিট করুন";
                document.getElementById('nTitle').value = notice.title;
                document.getElementById('nDate').value = notice.date;
                document.getElementById('nSmk').value = notice.smk || "RJSOMP/00/000";
                document.getElementById('nDesc').value = notice.description;
                document.getElementById('nIsLive').checked = notice.isLive;

                document.getElementById('submitBtn').innerText = "আপডেট করুন";
                document.getElementById('cancelBtn').style.display = "block";
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            }
        }

        let unsubscribe = null;
        function initRealtimeListener() {
            if(unsubscribe) unsubscribe();
            const q = query(collection(db, "notices"), orderBy("timestamp", "desc"));
            unsubscribe = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('adminNoticeList');
                list.innerHTML = '';
                allAdminNotices = []; 
                
                if(!snapshot.empty){
                    snapshot.forEach((docSnap) => {
                        const notice = docSnap.data();
                        notice.id = docSnap.id;
                        allAdminNotices.push(notice); 

                        const smkText = notice.smk ? notice.smk : "RJSOMP/00/000";
                        const liveClass = notice.isLive ? 'live-active' : '';
                        const liveBadge = notice.isLive ? '<div class="live-badge">🔴 বর্তমানে লাইভ আছে</div>' : '';
                        const btnText = notice.isLive ? 'লাইভ থেকে সরান' : 'উপরে লাইভ করুন';
                        const btnClass = notice.isLive ? 'btn-live active' : 'btn-live';

                        list.innerHTML += `
                            <div class="n-item ${liveClass}">
                                <div class="n-header">
                                    <div>
                                        <h4 class="n-title">${notice.title}</h4>
                                        <span class="n-date">${notice.date} | স্মারক: ${smkText}</span><br>
                                        ${liveBadge}
                                    </div>
                                </div>
                                <div class="n-actions">
                                    <button class="action-btn ${btnClass}" onclick="toggleLive('${docSnap.id}', ${notice.isLive})">${btnText}</button>
                                    <button class="action-btn btn-edit" onclick="editNotice('${docSnap.id}')">এডিট</button>
                                    <button class="action-btn btn-del" onclick="deleteNotice('${docSnap.id}')">ডিলিট</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = '<p style="color:red;">কোনো বিজ্ঞপ্তি নেই</p>';
                }
            });
        }

        window.toggleLive = async function(id, currentStatus) {
            await updateDoc(doc(db, "notices", id), { isLive: !currentStatus });
        }

        window.deleteNotice = async function(id) {
            if(confirm("আপনি কি নিশ্চিত এটি ডিলিট করতে চান?")) {
                await deleteDoc(doc(db, "notices", id));
                if(editingId === id) cancelEdit(); 
            }
        }
    </script>
</body>
</html>
