<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অটো আইডি কার্ড জেনারেটর | রক্তযোদ্ধা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; background: #f1f5f9; overflow-x: hidden; }
        .modal-bg { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); }
        
        /* The Magic Render Box (Hidden from user, only for html2canvas) */
        #hidden-render-box { position: absolute; left: -9999px; top: 0; display: none; }
    </style>
    
    <script> document.documentElement.style.display = 'none'; </script>
</head>
<body class="p-3 sm:p-8 relative">

    <div class="max-w-7xl mx-auto pb-10">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-6 border-l-4 border-red-600 gap-3">
            <div class="flex items-center gap-4">
                <div class="bg-red-50 w-12 h-12 rounded-full flex items-center justify-center border border-red-200 text-xl text-red-600"><i class="fas fa-id-badge"></i></div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-gray-800">অটো আইডি কার্ড জেনারেটর</h1>
                    <p class="text-xs md:text-sm font-bold text-gray-500 mt-1">সব সদস্যের স্মার্ট আইডি কার্ড ইনফো জেনারেটর ও শেয়ারিং</p>
                </div>
            </div>
            <a href="admin.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2"><i class="fas fa-arrow-left"></i> ড্যাশবোর্ড</a>
        </div>

        <!-- Search -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-3 items-center">
            <div class="relative w-full md:flex-1">
                <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="searchInput" onkeyup="filterUsers()" placeholder="নাম বা মোবাইল নাম্বার দিয়ে খুঁজুন..." class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg outline-none focus:border-red-500 bg-gray-50 text-sm font-medium">
            </div>
            <div class="text-sm font-bold text-gray-600 bg-gray-100 px-4 py-2.5 rounded-lg border border-gray-200">
                মোট সদস্য: <span id="totalUsers" class="text-red-600">0</span>
            </div>
        </div>

        <!-- Data Grid -->
        <div id="users-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
            <div class="col-span-full text-center py-16"><i class="fas fa-circle-notch fa-spin text-4xl text-red-500 mb-4"></i><p class="font-bold text-gray-500">ডাটাবেজ থেকে তথ্য লোড করা হচ্ছে...</p></div>
        </div>
    </div>

    <!-- Live Edit Modal -->
    <div id="idCardModal" class="fixed inset-0 modal-bg z-[100] hidden flex items-center justify-center p-2 sm:p-4 opacity-0 transition-opacity duration-300">
        
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-4 sm:p-6 transform scale-95 transition-transform duration-300 relative flex flex-col h-[90vh] md:h-auto overflow-hidden" id="idCardModalContent">
            
            <button onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:text-red-600 hover:bg-red-50 transition shadow"><i class="fas fa-times"></i></button>
            
            <h3 class="text-lg font-bold text-gray-800 border-b border-gray-200 pb-3 mb-4 shrink-0"><i class="fas fa-edit text-blue-500"></i> আইডি কার্ড এডিটর</h3>
            
            <!-- Edit Form -->
            <div class="space-y-3 flex-grow overflow-y-auto pr-2 custom-scroll">
                <div><label class="block text-xs font-bold text-gray-700 mb-1">নাম</label><input type="text" id="edit_name" class="w-full p-2.5 border border-gray-300 rounded-lg focus:border-blue-500 outline-none text-sm font-bold bg-gray-50"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs font-bold text-gray-700 mb-1">পদবী</label><input type="text" id="edit_role" class="w-full p-2.5 border border-gray-300 rounded-lg focus:border-blue-500 outline-none text-sm font-semibold bg-gray-50"></div>
                    <div><label class="block text-xs font-bold text-gray-700 mb-1">রক্তের গ্রুপ</label><input type="text" id="edit_blood" class="w-full p-2.5 border border-red-200 rounded-lg focus:border-red-500 outline-none text-sm font-bold text-red-600 bg-red-50"></div>
                </div>
                <div><label class="block text-xs font-bold text-gray-700 mb-1">আইডি নং</label><input type="text" id="edit_idno" class="w-full p-2.5 border border-gray-300 rounded-lg outline-none text-sm font-mono font-bold text-gray-700 bg-gray-100" readonly></div>
                <div><label class="block text-xs font-bold text-gray-700 mb-1">মোবাইল</label><input type="text" id="edit_phone" class="w-full p-2.5 border border-gray-300 rounded-lg focus:border-blue-500 outline-none text-sm font-semibold bg-gray-50"></div>
                <div><label class="block text-xs font-bold text-gray-700 mb-1">ঠিকানা</label><textarea id="edit_address" rows="2" class="w-full p-2.5 border border-gray-300 rounded-lg focus:border-blue-500 outline-none text-sm font-semibold bg-gray-50"></textarea></div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">সভাপতির নাম</label>
                    <input type="text" id="edit_president" placeholder="Kazi Ibrahim" class="w-full p-2.5 border border-blue-200 rounded-lg focus:border-blue-500 outline-none text-sm font-bold bg-blue-50 text-blue-700">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 mt-2">সদস্যের নতুন ছবি দিন</label>
                    <input type="file" accept="image/*" onchange="changeIdPhoto(this)" class="w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-xs">
                </div>
            </div>

            <!-- Hidden Photo Holder -->
            <img id="c_photo" src="https://via.placeholder.com/150" class="hidden" crossorigin="anonymous">

            <!-- Actions -->
            <div class="shrink-0 border-t border-gray-200 pt-4 mt-4 space-y-2">
                <button onclick="processCardAction('download')" id="downloadImgBtn" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition shadow-lg flex items-center justify-center gap-2 text-sm">
                    <i class="fas fa-download"></i> কার্ড ডাউনলোড করুন (Front & Back)
                </button>
                <div class="flex gap-2">
                    <button onclick="copyCardData()" class="flex-1 bg-gray-800 text-white font-bold py-3 rounded-xl hover:bg-black transition shadow flex items-center justify-center gap-2 text-[13px]">
                        <i class="fas fa-copy"></i> শুধু তথ্য কপি
                    </button>
                    <button onclick="shareViaWhatsApp()" class="flex-1 bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 transition shadow flex items-center justify-center gap-2 text-[13px]">
                        <i class="fab fa-whatsapp text-lg"></i> হোয়াটসঅ্যাপ
                    </button>
                </div>
            </div>
            
        </div>
    </div>

    <!-- The Magic Container (Dynamic Injection for html2canvas) -->
    <div id="render-container"></div>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBB74MD8ZC1mUD787oqKqmXD-S4nb60yw", authDomain: "rjsomp.firebaseapp.com",
            projectId: "rjsomp", storageBucket: "rjsomp.firebasestorage.app", messagingSenderId: "1033528754332", appId: "1:1033528754332:web:a2dd02fc14096c1eeeed59"
        };
        
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        let mergedUsers = []; 
        let defaultPresident = "Kazi Ibrahim"; 

        onAuthStateChanged(auth, (user) => {
            if (user) { document.documentElement.style.display = ''; fetchAndMergeData(); } 
            else { window.top.location.href = "admin.html"; }
        });

        async function fetchAndMergeData() {
            try {
                const volSnap = await getDocs(collection(db, "volunteers"));
                const donSnap = await getDocs(collection(db, "blood_donors"));
                const memSnap = await getDocs(collection(db, "members"));

                let usersMap = new Map(); 

                const processDoc = (docSnap, roleName) => {
                    docSnap.forEach(d => {
                        let data = d.data();
                        let phone = data.phone || "NoPhone_" + d.id;
                        
                        if(usersMap.has(phone)) {
                            let existing = usersMap.get(phone);
                            if(!existing.roles.includes(roleName)) { existing.roles.push(roleName); }
                            if(!existing.photo && data.profileImageUrl) { existing.photo = data.profileImageUrl; }
                            if(!existing.address) { existing.address = [data.village, data.upazila, data.district].filter(Boolean).join(", "); }
                        } else {
                            let fullAddress = [data.village, data.upazila, data.district].filter(Boolean).join(", ");
                            let secretData = data.secretCode || data.secretPin;
                            if(!secretData) secretData = phone.slice(-4); 
                            let dynamicId = "RJF-" + secretData;

                            usersMap.set(phone, {
                                id: d.id, name: data.name, phone: phone, blood: data.bloodGroup || "N/A",
                                address: fullAddress, idNo: dynamicId, photo: data.profileImageUrl || "https://via.placeholder.com/150", roles: [roleName]
                            });
                        }
                    });
                };

                processDoc(volSnap, "Volunteer");
                processDoc(donSnap, "Blood Donor");
                processDoc(memSnap, "Member");

                mergedUsers = Array.from(usersMap.values());
                document.getElementById('totalUsers').innerText = mergedUsers.length;
                renderUsers(mergedUsers);
            } catch(e) { document.getElementById('users-grid').innerHTML = '<div class="col-span-full text-center py-10 text-red-600 font-bold">ডাটাবেজ থেকে তথ্য আনতে সমস্যা হয়েছে!</div>'; }
        }

        window.renderUsers = (usersArray) => {
            const grid = document.getElementById('users-grid');
            if(usersArray.length === 0) { grid.innerHTML = '<div class="col-span-full text-center py-16"><p class="text-gray-500 font-bold">কোনো সদস্য পাওয়া যায়নি!</p></div>'; return; }

            let html = '';
            usersArray.forEach((u) => {
                let roleString = u.roles.join(", ");
                let safeDataStr = encodeURIComponent(JSON.stringify(u)).replace(/'/g, "%27");

                html += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex items-center gap-4 transition hover:shadow-md">
                        <img src="${u.photo}" class="w-16 h-16 rounded-full object-cover border-[3px] border-red-100 shadow-sm shrink-0" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="flex-grow min-w-0">
                            <h3 class="font-bold text-gray-800 truncate leading-tight">${u.name}</h3>
                            <p class="text-[11px] font-bold text-red-600 mt-1 truncate"><i class="fas fa-tag"></i> ${roleString}</p>
                            <p class="text-[11px] font-bold text-gray-400 mt-0.5"><i class="fas fa-fingerprint"></i> ID: ${u.idNo}</p>
                        </div>
                        <button onclick="openIdModal('${safeDataStr}')" class="shrink-0 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white border border-red-200 w-10 h-10 rounded-xl flex items-center justify-center transition shadow-sm" title="আইডি কার্ড তৈরি করুন">
                            <i class="fas fa-address-card text-lg"></i>
                        </button>
                    </div>
                `;
            });
            grid.innerHTML = html;
        };

        window.filterUsers = () => {
            const txt = document.getElementById('searchInput').value.toLowerCase();
            const filtered = mergedUsers.filter(u => u.name.toLowerCase().includes(txt) || u.phone.includes(txt) || u.idNo.toLowerCase().includes(txt));
            renderUsers(filtered);
        };

        window.openIdModal = (dataStr) => {
            const u = JSON.parse(decodeURIComponent(dataStr));
            document.getElementById('edit_name').value = u.name;
            document.getElementById('edit_role').value = u.roles.join(", ");
            document.getElementById('edit_blood').value = u.blood;
            document.getElementById('edit_idno').value = u.idNo;
            document.getElementById('edit_phone').value = u.phone;
            document.getElementById('edit_address').value = u.address;
            document.getElementById('edit_president').value = defaultPresident;
            document.getElementById('c_photo').src = u.photo !== "https://via.placeholder.com/150" ? u.photo : "https://via.placeholder.com/150";

            const modal = document.getElementById('idCardModal');
            const content = document.getElementById('idCardModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        };

        window.closeModal = () => {
            const modal = document.getElementById('idCardModal');
            const content = document.getElementById('idCardModalContent');
            modal.classList.add('opacity-0'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        window.changeIdPhoto = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('c_photo').src = e.target.result; }
                reader.readAsDataURL(input.files[0]);
            }
        };

        // ================= The Magic Dynamic HTML Template (No CSS loops, 100% Downloadable) =================
        function getCardTemplateHTML() {
            const name = document.getElementById('edit_name').value;
            const role = document.getElementById('edit_role').value;
            const blood = document.getElementById('edit_blood').value;
            const idno = document.getElementById('edit_idno').value;
            const phone = document.getElementById('edit_phone').value;
            const pres = document.getElementById('edit_president').value || "Kazi Ibrahim";
            const photoSrc = document.getElementById('c_photo').src;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent('ID: ' + idno)}`;

            return `
            <div id="export-front" style="width: 340px; height: 530px; background: #ffffff; position: relative; font-family: 'Poppins', 'Noto Sans Bengali', sans-serif; box-sizing: border-box;">
                <!-- Left Red Bar -->
                <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 100px; background: #ef4444;"></div>
                
                <!-- Org Name -->
                <div style="position: absolute; top: 30px; right: 15px; text-align: right; width: 220px; z-index: 5;">
                    <div style="font-size: 16px; font-weight: 800; color: #000; line-height: 1.2;">ROKTOJODDA SOMAJ<br>O MANOB KOLLAYAN PORISHAD</div>
                </div>
                
                <!-- Photo (Rectangular overlapping) -->
                <div style="position: absolute; top: 120px; left: 20px; width: 150px; height: 180px; border: 8px solid #ef4444; background: #fff; box-sizing: border-box; z-index: 10;">
                    <img src="${photoSrc}" crossorigin="anonymous" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                
                <!-- Details -->
                <div style="position: absolute; top: 310px; right: 15px; text-align: right; width: 300px; z-index: 5;">
                    <div style="font-size: 24px; font-weight: 800; color: #000; text-transform: uppercase; line-height: 1.1; margin-bottom: 5px;">${name}</div>
                    <div style="font-size: 14px; font-weight: bold; color: #555; margin-bottom: 15px;">${role}</div>
                    <div style="font-size: 14px; font-weight: bold; color: #000; margin-bottom: 5px;">ID: ${idno}</div>
                    <div style="font-size: 18px; font-weight: 900; color: #ef4444;">🩸 ${blood}</div>
                </div>
                
                <!-- Signature -->
                <div style="position: absolute; bottom: 20px; right: 15px; text-align: right; z-index: 5;">
                    <div style="font-family: 'Dancing Script', cursive; font-size: 32px; color: #1e3a8a; line-height: 1; margin-bottom: 2px;">${pres}</div>
                    <div style="font-size: 10px; font-weight: 800; color: #555; border-top: 1px solid #999; padding-top: 3px;">PRESIDENT</div>
                </div>
            </div>

            <div id="export-back" style="width: 340px; height: 530px; background: #000000; position: relative; color: #ffffff; font-family: 'Poppins', 'Noto Sans Bengali', sans-serif; box-sizing: border-box;">
                <!-- Right Red Bar -->
                <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: #ef4444;"></div>
                
                <!-- QR Code -->
                <div style="position: absolute; top: 40px; left: 20px; width: 90px; height: 90px; background: #fff; padding: 5px; box-sizing: border-box; z-index: 10;">
                    <img src="${qrUrl}" crossorigin="anonymous" style="width: 100%; height: 100%;">
                </div>
                
                <!-- T&C -->
                <div style="position: absolute; top: 150px; left: 20px; width: 230px; text-align: left; z-index: 5;">
                    <div style="font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 12px;">Terms & Conditions</div>
                    <div style="font-size: 11px; color: #ccc; line-height: 1.6;">
                        1. This ID Card is issued solely for authorized volunteer activities of Rokttojoddha Somaj o Manob Kollayan Parishad.<br><br>
                        2. This ID Card is the property of the organization. It must not be misused, transferred, or allowed to be used by any other person without authorization.<br><br>
                        3. This ID Card does not guarantee any employment, official position, salary, or financial benefit.
                    </div>
                    <div style="font-size: 10px; color: #fef08a; margin-top: 25px; font-weight: bold; line-height: 1.4;">Note: This ID Card is valid only for authorized volunteer activities of the organization.</div>
                </div>
                
                <!-- Contact -->
                <div style="position: absolute; bottom: 30px; left: 20px; font-size: 11px; color: #ccc; line-height: 1.8; z-index: 5;">
                    <div>info.rkjsomkporishod@gmail.com</div>
                    <div>${phone}</div>
                    <div>rjsomp.web.app</div>
                </div>
            </div>`;
        }

        window.processCardAction = async (actionType) => {
            const btnDown = document.getElementById('downloadImgBtn');
            const originalDownText = btnDown.innerHTML;
            btnDown.innerHTML = '<i class="fas fa-spinner fa-spin"></i> প্রসেসিং হচ্ছে...'; 
            btnDown.disabled = true;

            const container = document.createElement('div');
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.style.top = '0';
            document.body.appendChild(container);
            
            container.innerHTML = getCardTemplateHTML();

            try {
                // ব্রাউজারকে ছবি লোড করার জন্য ১ সেকেন্ড সময় দেওয়া হলো (এটিই সমস্যার সমাধান)
                await new Promise(resolve => setTimeout(resolve, 1000));

                const opt = { scale: 2, useCORS: true, allowTaint: true, logging: false };
                
                const canvasFront = await html2canvas(document.getElementById('export-front'), { ...opt, backgroundColor: "#ffffff" });
                const canvasBack = await html2canvas(document.getElementById('export-back'), { ...opt, backgroundColor: "#000000" });

                const userName = document.getElementById('edit_name').value;

                if (actionType === 'download') {
                    const linkF = document.createElement('a');
                    linkF.download = `ID_Front_${userName}.jpg`;
                    linkF.href = canvasFront.toDataURL('image/jpeg', 1.0);
                    linkF.click();

                    await new Promise(r => setTimeout(r, 400));

                    const linkB = document.createElement('a');
                    linkB.download = `ID_Back_${userName}.jpg`;
                    linkB.href = canvasBack.toDataURL('image/jpeg', 1.0);
                    linkB.click();
                }
            } catch (error) {
                alert("ডাউনলোড করতে সমস্যা হয়েছে! ইন্টারনেট কানেকশন চেক করুন।");
                console.error(error);
            }

            document.body.removeChild(container);
            btnDown.innerHTML = originalDownText; 
            btnDown.disabled = false;
        };

        // ================= টেক্সট কপি লজিক =================
        window.copyCardData = () => {
            const name = document.getElementById('edit_name').value;
            const role = document.getElementById('edit_role').value;
            const blood = document.getElementById('edit_blood').value;
            const idno = document.getElementById('edit_idno').value;
            const phone = document.getElementById('edit_phone').value;
            const address = document.getElementById('edit_address').value;
            const pres = document.getElementById('edit_president').value || "Kazi Ibrahim";

            const textToCopy = `🩸 *রক্তযোদ্ধা আইডি কার্ডের তথ্য* 🩸\n\n👤 *নাম:* ${name}\n🏷 *পদবী:* ${role}\n🩸 *রক্তের গ্রুপ:* ${blood}\n🪪 *আইডি নং:* ${idno}\n📞 *মোবাইল:* ${phone}\n📍 *ঠিকানা:* ${address}\n\n🖋 *সভাপতি:* ${pres}\n\n(কম্পিউটার অপারেটর এই তথ্যগুলো ব্যবহার করে আইডি কার্ড প্রিন্ট করবেন)`;
            
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try { document.execCommand('copy'); alert("✅ আইডি কার্ডের সব তথ্য সুন্দরভাবে কপি করা হয়েছে!"); } 
            catch (err) { alert("দুঃখিত, তথ্য কপি করা সম্ভব হয়নি!"); }
            document.body.removeChild(textArea);
        };

        window.shareViaWhatsApp = () => {
