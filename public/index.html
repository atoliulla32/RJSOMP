<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রক্তযোদ্ধা সমাজ ও মানব কল্যাণ পরিষদ (RJSOMP)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-16 px-4">
        <div class="max-w-xl w-full text-center">
            
            <!-- Minimalist & Professional Working Notice Card -->
            <div class="bg-white border-t-4 border-red-600 shadow-xl rounded-3xl p-8 md:p-12 relative overflow-hidden transition-all duration-300">
                <div class="absolute -right-6 -bottom-6 text-red-50 opacity-50 pointer-events-none">
                    <i class="fa-solid fa-code text-9k" style="font-size: 140px;"></i>
                </div>
                
                <div class="inline-flex items-center justify-center bg-red-100 text-red-600 w-20 h-20 rounded-full font-bold mb-6 shadow-sm animate-pulse">
                    <i class="fa-solid fa-person-digging text-3xl"></i>
                </div>

                <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-4 tracking-tight">
                    ওয়েবসাইটের কাজ চলমান রয়েছে
                </h1>
                
                <p class="text-gray-500 text-sm md:text-base leading-relaxed mb-8">
                    “রক্তযোদ্ধা সমাজ ও মানব কল্যাণ পরিষদ”-এর অফিশিয়াল ওয়েবসাইটের ডেটা ও ডিজাইনিংয়ের কাজ খুব দ্রুতগতিতে এগিয়ে চলছে। খুব শীঘ্রই পূর্ণাঙ্গ রূপে এটি উন্মুক্ত করা হবে।
                </p>

                <div class="flex flex-col sm:flex-row justify-center gap-3">
                    <a href="register-donor" class="bg-red-600 text-white px-5 py-3 rounded-xl font-bold text-sm hover:bg-red-700 transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> রক্তদাতা হোন
                    </a>
                    <a href="search-donor" class="bg-gray-100 text-gray-700 px-5 py-3 rounded-xl font-bold text-sm hover:bg-gray-200 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i> ডোনার খুঁজুন
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Safe Header & Footer Loader Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("header.html")
                .then(res => res.ok ? res.text() : "")
                .then(data => { if(data) document.getElementById("header-placeholder").innerHTML = data; })
                .catch(err => console.log("Header load skipped"));

            fetch("footer.html")
                .then(res => res.ok ? res.text() : "")
                .then(data => { if(data) document.getElementById("footer-placeholder").innerHTML = data; })
                .catch(err => console.log("Footer load skipped"));
        });
    </script>
</body>
</html>
