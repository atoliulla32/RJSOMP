<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>আমাদের সম্পর্কে | রক্তযোদ্ধা সমাজ ও মানব কল্যাণ পরিষদ</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .segmented-control {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background-color: #f3f4f6;
            padding: 8px;
            border-radius: 16px;
        }
        
        .tab-btn {
            padding: 12px 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #6b7280;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        
        .tab-btn.active {
            background-color: #ffffff;
            color: #dc2626;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .tab-btn.active i { transform: scale(1.1); color: #dc2626; }
    </style>

    <script>
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            btnElement.classList.add('active');
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">
    
    <div id="header-placeholder"></div>

    <main class="flex-grow pb-16">
        <section class="bg-[#111827] text-white pt-10 pb-16 px-4 text-center relative overflow-hidden rounded-b-[40px] shadow-lg mb-8">
            <div class="absolute inset-0 opacity-20" style="background-image: url('https://res.cloudinary.com/h0dlj3no/image/upload/v1789160839/43189_ed9caz.jpg'); background-size: cover; background-position: center; filter: blur(2px);"></div>
            <div class="relative z-10 max-w-4xl mx-auto mt-4">
                <span class="bg-red-600/20 text-red-400 border border-red-500/30 px-4 py-1 rounded-full text-xs font-bold tracking-widest uppercase mb-4 inline-block">আমাদের সম্পর্কে</span>
                <h1 class="text-3xl md:text-5xl font-extrabold mb-3">রক্তযোদ্ধা সমাজ ও মানব কল্যাণ পরিষদ</h1>
                <p class="text-sm md:text-base text-gray-300 font-medium">“জীবনের জন্য রক্ত, সমাজের জন্য দায়িত্ব”</p>
            </div>
        </section>

        <div class="max-w-5xl mx-auto px-4 -mt-14 relative z-20">
            
            <div class="segmented-control shadow-xl border border-gray-100 mb-10 max-w-2xl mx-auto">
                <div onclick="switchTab('tab-history', this)" class="tab-btn active">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>ইতিহাস</span>
                </div>
                <div onclick="switchTab('tab-achievements', this)" class="tab-btn">
                    <i class="fa-solid fa-trophy"></i>
                    <span>অর্জন</span>
                </div>
                <div onclick="switchTab('tab-committee', this)" class="tab-btn">
                    <i class="fa-solid fa-users-viewfinder"></i>
                    <span>পরিষদ ও সদস্য</span>
                </div>
            </div>

            <div id="tab-history" class="tab-content animate-fade-in">
                <div class="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-gray-100">
                    <h2 class="text-xl md:text-2xl font-extrabold text-gray-800 mb-6 flex items-center gap-3">
                        <span class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-600"><i class="fa-solid fa-book-open"></i></span>
                        প্রতিষ্ঠার ইতিহাস
                    </h2>
                    <p id="show-history" class="text-gray-600 leading-relaxed text-sm md:text-base text-justify">
                        <i class="fas fa-spinner fa-spin text-red-500"></i> তথ্য লোড হচ্ছে...
                    </p>
                </div>
            </div>

            <div id="tab-achievements" class="tab-content hidden animate-fade-in max-w-4xl mx-auto">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 text-center hover:shadow-md transition">
                        <div class="w-16 h-16 mx-auto bg-red-50 rounded-full flex items-center justify-center mb-4">
                            <i class="fa-solid fa-droplet text-3xl text-red-500"></i>
                        </div>
                        <h3 id="show-bags" class="text-3xl font-extrabold text-gray-900">0</h3>
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mt-1">রক্তদান (ব্যাগ)</p>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 text-center hover:shadow-md transition">
                        <div class="w-16 h-16 mx-auto bg-blue-50 rounded-full flex items-center justify-center mb-4">
                            <i class="fa-solid fa-users text-3xl text-blue-500"></i>
                        </div>
                        <h3 id="show-donors" class="text-3xl font-extrabold text-gray-900">0</h3>
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mt-1">নিবন্ধিত রক্তদাতা</p>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 text-center hover:shadow-md transition">
                        <div class="w-16 h-16 mx-auto bg-green-50 rounded-full flex items-center justify-center mb-4">
                            <i class="fa-solid fa-hand-holding-heart text-3xl text-green-500"></i>
                        </div>
                        <h3 id="show-volunteers" class="text-3xl font-extrabold text-gray-900">0</h3>
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mt-1">স্বেচ্ছাসেবক</p>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 text-center hover:shadow-md transition">
                        <div class="w-16 h-16 mx-auto bg-yellow-50 rounded-full flex items-center justify-center mb-4">
                            <i class="fa-solid fa-face-smile text-3xl text-yellow-500"></i>
                        </div>
                        <h3 class="text-3xl font-extrabold text-gray-900"><i class="fa-solid fa-infinity text-2xl"></i></h3>
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mt-1">অগণিত হাসি</p>
                    </div>
                </div>
            </div>

            <!-- পরিষদ ও সদস্য সেকশন -->
            <div id="tab-committee" class="tab-content hidden animate-fade-in">
                <div class="text-center mb-6">
                    <span id="show-tenure" class="hidden text-sm font-bold text-red-600 bg-red-50 px-5 py-2 rounded-full border border-red-200"></span>
                </div>
                
                <!-- ডাইনামিক ক্যাটাগরিগুলো এখানে রেন্ডার হবে -->
                <div id="members-container" class="space-y-10">
                    <div class="text-center text-gray-500 py-10"><i class="fas fa-spinner fa-spin text-3xl mb-3 block text-red-500"></i> ডেটা লোড হচ্ছে...</div>
                </div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBB74MD8ZC1mUD787oqKqmXD-S4nb60yw",
            authDomain: "rjsomp.firebaseapp.com",
            databaseURL: "https://rjsomp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rjsomp"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const aboutRef = ref(db, 'pageContent/aboutData');

        // ক্যাটাগরির সঠিক সিরিয়াল
        const categoryOrder = [
            { id: 'chairman', name: 'চেয়ারম্যান' },
            { id: 'advisory_council', name: 'উপদেষ্টা পরিষদ' },
            { id: 'board_of_directors', name: 'পরিচালক মন্ডলী' },
            { id: 'executive_council', name: 'বর্তমান কার্যনির্বাহী পরিষদ' },
            { id: 'executive_members', name: 'কার্যকরী সদস্য' },
            { id: 'donor_members', name: 'দাতা সদস্য' },
            { id: 'life_members', name: 'আজীবন সদস্য' },
            { id: 'general_members', name: 'সাধারণ সদস্য' }
        ];

        onValue(aboutRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('show-history').innerHTML = (data.history || '').replace(/\n/g, '<br><br>');
                document.getElementById('show-bags').innerText = data.bags || '0';
                document.getElementById('show-donors').innerText = data.donors || '0';
                document.getElementById('show-volunteers').innerText = data.volunteers || '0';

                const tenureBadge = document.getElementById('show-tenure');
                if(data.committeeTenure && data.committeeTenure.trim() !== '') {
                    tenureBadge.innerHTML = `<i class="fa-regular fa-calendar-check mr-2"></i> কমিটির মেয়াদ: ${data.committeeTenure}`;
                    tenureBadge.classList.remove('hidden');
                } else {
                    tenureBadge.classList.add('hidden');
                }

                // সদস্য রেন্ডার করা
                const membersContainer = document.getElementById('members-container');
                const membersData = data.membersList || {};
                
                // অবজেক্ট থেকে অ্যারেতে রূপান্তর
                const allMembers = Object.values(membersData);

                let fullHtml = '';

                categoryOrder.forEach(category => {
                    // এই ক্যাটাগরির সদস্যদের ফিল্টার করা
                    const categoryMembers = allMembers.filter(m => m.category === category.id);
                    
                    if(categoryMembers.length > 0) {
                        fullHtml += `
                            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 md:p-8">
                                <h2 class="text-xl md:text-2xl font-extrabold text-gray-800 mb-6 flex items-center gap-3 border-b pb-4 border-gray-100">
                                    <span class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600 text-sm"><i class="fa-solid fa-users"></i></span>
                                    ${category.name}
                                </h2>
                                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        `;

                        categoryMembers.forEach(member => {
                            fullHtml += `
                                <div class="bg-gray-50 border border-gray-100 rounded-[16px] p-4 shadow-sm text-center hover:shadow-md transition hover:-translate-y-1">
                                    <div class="mx-auto mb-3 relative w-16 h-16 sm:w-20 sm:h-20">
                                        <img src="${member.image}" class="w-full h-full rounded-full object-cover border-[3px] border-white shadow-md mx-auto">
                                    </div>
                                    <h3 class="text-xs sm:text-sm font-extrabold text-gray-800 mb-1">${member.name}</h3>
                                    ${member.title ? `<p class="text-[10px] sm:text-xs font-bold text-red-600 bg-red-50 px-2 py-1 rounded inline-block w-full truncate">${member.title}</p>` : ''}
                                </div>
                            `;
                        });

                        fullHtml += `
                                </div>
                            </div>
                        `;
                    }
                });

                if(fullHtml === '') {
                    membersContainer.innerHTML = '<div class="text-center text-gray-500 py-10 font-bold">এখনো কোনো সদস্য যুক্ত করা হয়নি।</div>';
                } else {
                    membersContainer.innerHTML = fullHtml;
                }
            }
        });

        // Load Header & Footer
        document.addEventListener("DOMContentLoaded", () => {
            fetch("header.html").then(r => r.ok ? r.text() : "").then(d => { if(d) document.getElementById("header-placeholder").innerHTML = d; });
            fetch("footer.html").then(r => r.ok ? r.text() : "").then(d => { if(d) document.getElementById("footer-placeholder").innerHTML = d; });
        });
    </script>
</body>
</html>
