<!-- CSS Only Tooltip Animation (No JavaScript needed!) -->
<style>
    @keyframes autoTooltipDance {
        0%, 71% { 
            /* ০ থেকে ৫ সেকেন্ড পর্যন্ত লুকানো থাকবে */
            opacity: 0; 
            transform: scale(0.8) translateY(10px); 
        }
        73% { 
            /* ৫ সেকেন্ড পার হলে লাফিয়ে উঠবে */
            opacity: 1; 
            transform: scale(1.1) translateY(-10px); 
        }
        76% { 
            transform: scale(1) translateY(0); 
        }
        80% { 
            transform: scale(1.05) translateY(-5px); 
        }
        85% { 
            transform: scale(1) translateY(0); 
        }
        95% { 
            /* ২ সেকেন্ড স্ক্রিনে থাকার পর হাইড হওয়া শুরু করবে */
            opacity: 1; 
            transform: scale(1) translateY(0); 
        }
        100% { 
            opacity: 0; 
            transform: scale(0.8) translateY(10px); 
        }
    }
    .auto-dancing-tooltip {
        /* ৭ সেকেন্ডের লুপ (৫ সেকেন্ড অফ, ২ সেকেন্ড অন) */
        animation: autoTooltipDance 7s infinite ease-in-out;
    }
</style>
