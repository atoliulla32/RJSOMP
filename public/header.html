<!-- Guaranteed Tooltip Animation Script -->
<script>
    (function() {
        function initTooltip() {
            const tooltip = document.getElementById('app-download-tooltip');
            if (tooltip) {
                function triggerPopup() {
                    // পপআপ দৃশ্যমান করা
                    tooltip.style.opacity = '1';
                    tooltip.style.transform = 'scale(1)';

                    // ৪ সেকেন্ড পর আবার হাইড করা
                    setTimeout(() => {
                        tooltip.style.opacity = '0';
                        tooltip.style.transform = 'scale(0.95)';
                    }, 4000);
                }

                // পেজ লোড হওয়ার ২ সেকেন্ড পর প্রথমবার দেখাবে
                setTimeout(triggerPopup, 2000);

                // প্রতি ১০ সেকেন্ড পর পর রিকারিং লুপ চলবে
                setInterval(triggerPopup, 10000);
            } else {
                // যদি এলিমেন্ট পেতে দেরি হয়, তবে আবার চেষ্টা করবে
                setTimeout(initTooltip, 500);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTooltip);
        } else {
            initTooltip();
        }
    })();
</script>
