<!-- Custom CSS Animations -->
<style>
    /* Tooltip Bounce Animation */
    @keyframes autoTooltipDance {
        0%, 71% { opacity: 0; transform: scale(0.8) translateY(-10px); }
        73% { opacity: 1; transform: scale(1.1) translateY(8px); }
        76% { transform: scale(1) translateY(0); }
        80% { transform: scale(1.05) translateY(4px); }
        85% { transform: scale(1) translateY(0); }
        95% { opacity: 1; transform: scale(1) translateY(0); }
        100% { opacity: 0; transform: scale(0.8) translateY(-10px); }
    }
    .auto-dancing-tooltip { animation: autoTooltipDance 7s infinite ease-in-out; }

    /* Blood Flow Border Animation */
    @keyframes bloodFlow { 100% { transform: rotate(360deg); } }
    .btn-blood-flow {
        position: relative; overflow: hidden; border-radius: 0.75rem; 
        z-index: 1; color: #dc2626; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.2);
    }
    .btn-blood-flow::before {
        content: ''; position: absolute;
        top: -150%; left: -150%; right: -150%; bottom: -150%;
        background: conic-gradient(from 0deg, transparent 60%, rgba(239, 68, 68, 0.4) 75%, #dc2626 90%, #7f1d1d 100%);
        animation: bloodFlow 1.5s linear infinite; z-index: -2;
    }
    .btn-blood-flow::after {
        content: ''; position: absolute; inset: 2.5px; 
        background: #ffffff; border-radius: 0.65rem; z-index: -1; transition: background 0.3s;
    }
    .btn-blood-flow:hover::after { background: #fef2f2; }

    /* ================= Live Notice Board Styles (Below Header) ================= */
    .header-live-board {
        display: flex; align-items: center; background: linear-gradient(to right, #0f172a, #1e293b);
        width: 100%; height: 38px; box-sizing: border-box; border-bottom: 2px solid #ef4444; overflow: hidden;
    }
    .header-board-badge {
        background: #dc2626; color: white; padding: 0 16px; font-weight: 800; font-size: 12px;
        height: 100%; display: flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
        box-shadow: 4px 0 10px rgba(0,0,0,0.4); z-index: 2; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .header-marquee-wrapper { flex-grow: 1; padding: 0 15px; overflow: hidden; display: flex; align-items: center; height: 100%; }
    .header-marquee-text { color: #f8fafc; font-size: 13.5px; font-weight: 500; display: flex; align-items: center; }
    .header-marquee-text span.date { color: #facc15; font-weight: 700; margin-right: 10px; }
    .header-marquee-text span.divider { color: #475569; margin: 0 12px; }
    @keyframes ringBell { 
        0% { transform: rotate(0); } 10% { transform: rotate(20deg); } 20% { transform: rotate(-20deg); } 
        30% { transform: rotate(15deg); } 40% { transform: rotate(-15deg); } 50% { transform: rotate(0); } 100% { transform: rotate(0); } 
    }
    .bell-icon { animation: ringBell 2s infinite; }
</style>

<!-- Firebase Live Notice Fetch Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your blood donation website Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDBB74MD8ZC1mUD787oqKqmXD-S4nb60yw",
      authDomain: "rjsomp.firebaseapp.com",
      databaseURL: "https://rjsomp-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "rjsomp",
      storageBucket: "rjsomp.firebasestorage.app",
      messagingSenderId: "1033528754332",
      appId: "1:1033528754332:web:a2dd02fc14096c1eeeed59"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fetch live notices from Firestore
    function loadLiveNotices() {
        const marqueeContent = document.getElementById('header-marquee-content');
        
        // এখানে আপনার ডাটাবেজের নোটিশ টেবিলের নাম দেবেন (যেমন: "notices" বা "news")
        const q = query(collection(db, "notices"), where("isLive", "==", true), orderBy("timestamp", "desc"));
        
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                document.getElementById('headerLiveBoard').style.display = 'none'; // নোটিশ না থাকলে বোর্ড হাইড হবে
                return;
            }

            document.getElementById('headerLiveBoard').style.display = 'flex'; // নোটিশ থাকলে বোর্ড শো হবে
            let html = '';
            
            snapshot.forEach((doc) => {
                const notice = doc.data();
                html += `<span class="date">[${notice.date || 'নতুন আপডেট'}]</span> ${notice.title} <span class="divider">||</span> `;
            });
            
            marqueeContent.innerHTML = html;
        }, (error) => {
            console.error("Notice Load Error: ", error);
        });
    }

    loadLiveNotices();
</script>
