<!-- Custom CSS Animations -->
<style>
    /* Tooltip Bounce Animation */
    @keyframes autoTooltipDance {
        0%, 71% { opacity: 0; transform: scale(0.8) translateY(-10px); }
        73% { opacity: 1; transform: scale(1.1) translateY(8px); }
        76% { transform: scale(1) translateY(0); }
        80% { transform: scale(1.05) translateY(4px); }
        85% { transform: scale(1) translateY(0); }
        95% { opacity: 1; transform: scale(1) translateY(0); }
        100% { opacity: 0; transform: scale(0.8) translateY(-10px); }
    }
    .auto-dancing-tooltip {
        animation: autoTooltipDance 7s infinite ease-in-out;
    }

    /* Blood Flow Border Animation */
    @keyframes bloodFlow {
        100% { transform: rotate(360deg); }
    }
    .btn-blood-flow {
        position: relative;
        overflow: hidden;
        border-radius: 0.75rem; 
        z-index: 1;
        color: #dc2626; /* Red text */
        box-shadow: 0 4px 15px rgba(220, 38, 38, 0.2);
    }
    .btn-blood-flow::before {
        content: '';
        position: absolute;
        top: -150%; left: -150%; right: -150%; bottom: -150%;
        /* রক্তের কালার গ্রেডিয়েন্ট: হালকা থেকে গাঢ় লাল */
        background: conic-gradient(from 0deg, transparent 60%, rgba(239, 68, 68, 0.4) 75%, #dc2626 90%, #7f1d1d 100%);
        animation: bloodFlow 1.5s linear infinite;
        z-index: -2;
    }
    .btn-blood-flow::after {
        content: '';
        position: absolute;
        inset: 2.5px; /* রক্তের প্রবাহের পুরুত্ব */
        background: #ffffff;
        border-radius: 0.65rem;
        z-index: -1;
        transition: background 0.3s;
    }
    .btn-blood-flow:hover::after {
        background: #fef2f2; /* Hover-এ হালকা লালচে সাদা */
    }
</style>
