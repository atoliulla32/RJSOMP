<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>আমাদের সম্পর্কে এডিট | রক্তযোদ্ধা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBB74MD8ZC1mUD787oqKqmXD-S4nb60yw",
            authDomain: "rjsomp.firebaseapp.com",
            databaseURL: "https://rjsomp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rjsomp",
            storageBucket: "rjsomp.firebasestorage.app",
            messagingSenderId: "1033528754332",
            appId: "1:1033528754332:web:a2dd02fc14096c1eeeed59"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const aboutRef = ref(db, 'pageContent/aboutData');

        // ডাটাবেজ থেকে ডাটা লোড করা
        onValue(aboutRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('history').value = data.history || '';
                document.getElementById('bags').value = data.bags || '';
                document.getElementById('donors').value = data.donors || '';
                document.getElementById('volunteers').value = data.volunteers || '';
                document.getElementById('committee').value = data.committee || '';
                document.getElementById('advisors').value = data.advisors || '';
                document.getElementById('members').value = data.members || '';
            }
        });

        // ডাটাবেজে সেভ করা
        window.saveAboutData = (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> সেভ হচ্ছে...';

            const newData = {
                history: document.getElementById('history').value,
                bags: document.getElementById('bags').value,
                donors: document.getElementById('donors').value,
                volunteers: document.getElementById('volunteers').value,
                committee: document.getElementById('committee').value,
                advisors: document.getElementById('advisors').value,
                members: document.getElementById('members').value
            };

            set(aboutRef, newData).then(() => {
                alert("তথ্য সফলভাবে আপডেট হয়েছে!");
                btn.innerHTML = '<i class="fas fa-save"></i> আপডেট সেভ করুন';
            }).catch(error => {
                alert("সমস্যা হয়েছে: " + error.message);
                btn.innerHTML = '<i class="fas fa-save"></i> আপডেট সেভ করুন';
            });
        };
    </script>
</head>
<body class="bg-gray-50 p-6 font-sans pb-20">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-md border-t-4 border-orange-500">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-3"><i class="fas fa-edit text-orange-500"></i> "আমাদের সম্পর্কে" পেজ কন্ট্রোল</h2>
        
        <form onsubmit="saveAboutData(event)" class="space-y-6">
            
            <!-- ইতিহাস -->
            <div>
                <label class="block font-bold text-gray-700 mb-2">প্রতিষ্ঠার ইতিহাস ও পরিচিতি</label>
                <textarea id="history" rows="5" class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-orange-500" required></textarea>
            </div>

            <!-- অর্জন -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-orange-50 rounded-lg border border-orange-100">
                <div>
                    <label class="block font-bold text-sm text-gray-700 mb-1">মোট রক্তদান (ব্যাগ)</label>
                    <input type="text" id="bags" class="w-full border p-2 rounded" placeholder="যেমন: ২৫০০+">
                </div>
                <div>
                    <label class="block font-bold text-sm text-gray-700 mb-1">নিবন্ধিত রক্তদাতা</label>
                    <input type="text" id="donors" class="w-full border p-2 rounded" placeholder="যেমন: ৫০০+">
                </div>
                <div>
                    <label class="block font-bold text-sm text-gray-700 mb-1">সক্রিয় স্বেচ্ছাসেবক</label>
                    <input type="text" id="volunteers" class="w-full border p-2 rounded" placeholder="যেমন: ৩৫+">
                </div>
            </div>

            <!-- কমিটি -->
            <div class="bg-gray-50 p-4 rounded-lg border">
                <label class="block font-bold text-gray-700 mb-2">বর্তমান কার্যনির্বাহী কমিটি</label>
                <p class="text-xs text-red-500 mb-2">নিয়ম: প্রতি লাইনে পদবী এবং নাম একটি কোলন (:) দিয়ে লিখুন। যেমন: <b>সভাপতি : কাজী সোহাগ</b></p>
                <textarea id="committee" rows="6" class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-orange-500"></textarea>
            </div>

            <!-- উপদেষ্টা ও সদস্য -->
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold text-gray-700 mb-2">উপদেষ্টা পরিষদ (নিচে নিচে নাম লিখুন)</label>
                    <textarea id="advisors" rows="5" class="w-full border border-gray-300 p-3 rounded"></textarea>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-2">সাধারণ সদস্যবৃন্দ (নিচে নিচে নাম লিখুন)</label>
                    <textarea id="members" rows="5" class="w-full border border-gray-300 p-3 rounded"></textarea>
                </div>
            </div>

            <button type="submit" id="saveBtn" class="w-full bg-orange-600 text-white font-bold py-3 rounded-lg hover:bg-orange-700 transition text-lg shadow-md">
                <i class="fas fa-save"></i> আপডেট সেভ করুন
            </button>
        </form>
    </div>

</body>
</html>
