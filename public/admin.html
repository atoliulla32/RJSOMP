<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সেন্ট্রাল অ্যাডমিন প্যানেল | রক্তযোদ্ধা</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, updatePassword, reauthenticateWithCredential, EmailAuthProvider, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBB74MD8ZC1mUD787oqKqmXD-S4nb60yw",
            authDomain: "rjsomp.firebaseapp.com",
            databaseURL: "https://rjsomp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rjsomp",
            storageBucket: "rjsomp.firebasestorage.app",
            messagingSenderId: "1033528754332",
            appId: "1:1033528754332:web:a2dd02fc14096c1eeeed59",
            measurementId: "G-Z0ESNH3XZD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // UI এলিমেন্ট
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const errorMessage = document.getElementById('error-message');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                // ডিফল্ট হিসেবে index-admin.html লোড হবে
                const savedUrl = localStorage.getItem('activeAdminPanel') || 'index-admin.html';
                loadPanel(savedUrl);
            } else {
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        });

        // লগইন সাবমিট
        window.handleLogin = (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => { errorMessage.classList.add('hidden'); })
                .catch(() => {
                    errorMessage.classList.remove('hidden');
                    errorMessage.innerHTML = "<i class='fas fa-exclamation-triangle mr-1'></i> ভুল ইমেইল বা পাসওয়ার্ড!";
                });
        };

        // পাসওয়ার্ড ভুলে গেলে
        window.handleForgotPassword = () => {
            const email = document.getElementById('email').value;
            if(!email) {
                alert("অনুগ্রহ করে উপরের বক্সে আপনার ইমেইলটি লিখুন, তারপর 'পাসওয়ার্ড ভুলে গেছেন?' এ ক্লিক করুন।");
                return;
            }
            sendPasswordResetEmail(auth, email)
                .then(() => alert("পাসওয়ার্ড রিসেট লিংক আপনার ইমেইলে পাঠানো হয়েছে!"))
                .catch((error) => alert("ত্রুটি: " + error.message));
        }

        // লগআউট
        window.handleLogout = () => {
            signOut(auth).then(() => localStorage.removeItem('activeAdminPanel'));
        };

        // পাসওয়ার্ড পরিবর্তন মডাল কন্ট্রোল
        window.openPasswordModal = () => document.getElementById('password-modal').classList.remove('hidden');
        window.closePasswordModal = () => {
            document.getElementById('password-modal').classList.add('hidden');
            document.getElementById('pwdChangeForm').reset();
            document.getElementById('pwd-msg').innerText = '';
        };

        // পাসওয়ার্ড পরিবর্তন সাবমিট
        window.handleChangePassword = (e) => {
            e.preventDefault();
            const msgBox = document.getElementById('pwd-msg');
            const oldPwd = document.getElementById('old-password').value;
            const newPwd = document.getElementById('new-password').value;
            const user = auth.currentUser;

            if (user) {
                const credential = EmailAuthProvider.credential(user.email, oldPwd);
                msgBox.innerHTML = '<span class="text-blue-600"><i class="fas fa-spinner fa-spin"></i> যাচাই করা হচ্ছে...</span>';
                
                reauthenticateWithCredential(user, credential).then(() => {
                    updatePassword(user, newPwd).then(() => {
                        msgBox.innerHTML = '<span class="text-green-600 font-bold"><i class="fas fa-check-circle"></i> পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে!</span>';
                        setTimeout(closePasswordModal, 2000);
                    }).catch(() => {
                        msgBox.innerHTML = `<span class="text-red-600 font-bold"><i class="fas fa-times-circle"></i> নতুন পাসওয়ার্ড আপডেট করতে সমস্যা হয়েছে!</span>`;
                    });
                }).catch(() => {
                    msgBox.innerHTML = '<span class="text-red-600 font-bold"><i class="fas fa-times-circle"></i> পুরাতন পাসওয়ার্ড ভুল!</span>';
                });
            }
        };
    </script>
    
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; }
        .active-nav { background-color: #1e293b !important; color: #ef4444 !important; border-left: 4px solid #ef4444; font-weight: bold; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .login-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            position: relative;
        }
        .login-bg::before {
            content: ''; position: absolute; inset: 0;
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%239C92AC" fill-opacity="0.05"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }
    </style>
</head>
<body class="bg-gray-50 overflow-hidden font-sans m-0 p-0">

    <!-- ================= লগইন সেকশন ================= -->
    <div id="login-section" class="fixed inset-0 z-[100] flex items-center justify-center login-bg hidden">
        <div class="bg-white w-full max-w-md p-8 sm:p-10 rounded-[24px] shadow-2xl relative overflow-hidden mx-4">
            <div class="h-2 w-full bg-gradient-to-r from-red-500 via-red-600 to-red-800 absolute top-0 left-0"></div>
            
            <div class="text-center mb-8 mt-2">
                <div class="inline-block bg-red-50 p-4 rounded-full mb-4 ring-8 ring-red-50/50 shadow-inner">
                    <i class="fas fa-shield-alt text-4xl text-red-600"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">সেন্ট্রাল অ্যাডমিন প্যানেল</h2>
                <p class="text-xs text-gray-500 mt-1 font-medium">রক্তযোদ্ধা সমাজ ও মানব কল্যাণ পরিষদ</p>
            </div>

            <div id="error-message" class="hidden mb-5 p-3 bg-red-50 text-red-600 text-sm rounded-xl text-center font-bold border border-red-200 shadow-sm"></div>

            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide">অ্যাডমিন ইমেইল</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="email" id="email" required placeholder="admin@example.com" class="w-full border border-gray-300 pl-10 pr-4 py-3 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 bg-gray-50 text-sm transition-colors">
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide">পাসওয়ার্ড</label>
                        <button type="button" onclick="handleForgotPassword()" class="text-[11px] font-bold text-blue-600 hover:text-blue-800 transition">পাসওয়ার্ড ভুলে গেছেন?</button>
                    </div>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full border border-gray-300 pl-10 pr-4 py-3 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 bg-gray-50 text-sm transition-colors">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gray-900 hover:bg-red-600 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg mt-4 flex justify-center items-center gap-2">
                    লগইন করুন <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- ================= মূল ড্যাশবোর্ড সেকশন ================= -->
    <div id="dashboard-section" class="hidden h-screen w-screen relative">
        
        <!-- মোবাইল মেনু টগল বাটন -->
        <button onclick="toggleMenu()" class="fixed top-4 left-4 z-40 bg-white/90 backdrop-blur text-gray-800 px-4 py-2.5 rounded-xl shadow-md hover:bg-white hover:text-red-600 transition-all flex items-center gap-2 border border-gray-200">
            <i class="fas fa-bars"></i> <span class="font-bold text-sm">মেনু</span>
        </button>

        <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity"></div>

        <!-- সাইডবার -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full transition-transform duration-300 z-50 w-72 bg-slate-900 text-slate-300 flex flex-col shadow-2xl h-full border-r border-slate-800">
            <div class="p-6 flex items-center justify-between border-b border-slate-800 bg-slate-950">
                <h2 class="text-lg font-black text-white flex items-center gap-2 tracking-wide">
                    <i class="fas fa-shield-halved text-red-500"></i> রক্তযোদ্ধা অ্যাডমিন
                </h2>
                <button onclick="toggleMenu()" class="text-slate-400 hover:text-white transition w-8 h-8 flex justify-center items-center"><i class="fas fa-chevron-left"></i></button>
            </div>

            <!-- মেনু আইটেম সমূহ -->
            <nav class="flex-1 overflow-y-auto p-4 space-y-1.5 no-scrollbar pb-32">
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 ml-2 mt-2">মেইন প্যানেল</div>

                <button onclick="loadPanel('index-admin.html', this)" class="menu-item flex items-center gap-3 w-full text-left px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-home text-blue-400 w-5 text-center"></i> হোমপেজ আপডেট
                </button>
                
                <button onclick="loadPanel('admin-blodrequests.html', this)" class="menu-item flex items-center gap-3 w-full text-left px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-heartbeat text-red-400 w-5 text-center"></i> রক্তের রিকোয়েস্ট
                </button>
                
                <button onclick="loadPanel('notice-admin.html', this)" class="menu-item flex items-center gap-3 w-full text-left px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-bullhorn text-yellow-400 w-5 text-center"></i> লাইভ নোটিশ বোর্ড
                </button>
                
                <button onclick="loadPanel('join-us-admin.html', this)" class="menu-item flex items-center gap-3 w-full text-left px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-users-cog text-emerald-400 w-5 text-center"></i> সদস্য ও স্বেচ্ছাসেবক
                </button>
                
                <button onclick="loadPanel('admin-donations.html', this)" class="menu-item flex items-center gap-3 w-full text-left px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-hand-holding-dollar text-orange-400 w-5 text-center"></i> ডোনেশন ও ফান্ডিং
                </button>
                
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 ml-2 mt-6">অন্যান্য সেটিং</div>

                <button onclick="loadPanel('admin-gallery.html', this)" class="menu-item flex items-center gap-3 w-full text-left px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-images text-purple-400 w-5 text-center"></i> গ্যালারি ও নিউজ
                </button>
                
                <button onclick="loadPanel('admin-about.html', this)" class="menu-item flex items-center gap-3 w-full text-left px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fas fa-info-circle text-teal-400 w-5 text-center"></i> আমাদের সম্পর্কে
                </button>
            </nav>

            <!-- বটম সেকশন -->
            <div class="p-4 border-t border-slate-800 bg-slate-950 absolute bottom-0 w-full space-y-2">
                <button onclick="openPasswordModal()" class="flex items-center justify-center gap-2 w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 px-4 rounded-xl text-xs font-bold transition">
                    <i class="fas fa-key text-yellow-500"></i> পাসওয়ার্ড পরিবর্তন
                </button>
                <button onclick="handleLogout()" class="flex items-center justify-center gap-2 w-full bg-red-600/10 hover:bg-red-600 border border-red-500/30 hover:border-red-600 text-red-500 hover:text-white py-2.5 px-4 rounded-xl text-xs font-bold transition">
                    <i class="fas fa-sign-out-alt"></i> লগআউট করুন
                </button>
            </div>
        </aside>

        <!-- আইফ্রেম কনটেইনার -->
        <main class="w-full h-full bg-gray-100">
            <iframe id="admin-frame" src="" class="w-full h-full border-0 pt-0 sm:pt-2"></iframe>
        </main>
    </div>

    <!-- ================= পাসওয়ার্ড পরিবর্তন মডাল ================= -->
    <div id="password-modal" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-sm p-6 sm:p-8 rounded-[24px] shadow-2xl relative mx-4">
            <button onclick="closePasswordModal()" class="absolute top-4 right-4 w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-red-100 hover:text-red-600 transition"><i class="fas fa-times"></i></button>
            
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl mb-3"><i class="fas fa-unlock-alt"></i></div>
                <h3 class="text-lg font-bold text-gray-900">পাসওয়ার্ড পরিবর্তন</h3>
            </div>
            
            <form id="pwdChangeForm" onsubmit="handleChangePassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">পুরাতন পাসওয়ার্ড</label>
                    <input type="password" id="old-password" required placeholder="বর্তমান পাসওয়ার্ড দিন" class="w-full border border-gray-300 px-4 py-2.5 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">নতুন পাসওয়ার্ড (অন্তত ৬ অক্ষর)</label>
                    <input type="password" id="new-password" required minlength="6" placeholder="নতুন শক্তিশালী পাসওয়ার্ড দিন" class="w-full border border-gray-300 px-4 py-2.5 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 outline-none text-sm">
                </div>
                
                <div id="pwd-msg" class="text-xs text-center font-medium min-h-[20px]"></div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md">পাসওয়ার্ড আপডেট করুন</button>
            </form>
        </div>
    </div>

    <!-- UI কন্ট্রোল স্ক্রিপ্ট -->
    <script>
        const frame = document.getElementById('admin-frame');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        window.loadPanel = function(url, element) {
            frame.src = url;
            localStorage.setItem('activeAdminPanel', url);
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active-nav'));
            
            if(element) {
                element.classList.add('active-nav');
            } else {
                // ডিফল্ট লোড বা রিফ্রেশের সময় অ্যাকটিভ মেনু মার্ক করা
                document.querySelectorAll('.menu-item').forEach(item => {
                    if(item.getAttribute('onclick').includes(url)) item.classList.add('active-nav');
                });
            }
            // মোবাইল স্ক্রিনে মেনু অটোমেটিক বন্ধ করা
            if(window.innerWidth < 1024 && !sidebar.classList.contains('-translate-x-full')) {
                toggleMenu();
            }
        }
    </script>
</body>
</html>
