<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>যোগাযোগ | রক্তযোদ্ধা সমাজ ও মানব কল্যাণ পরিষদ</title>
    
    <!-- ক্যাশ রিমুভার -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">
    
    <!-- হেডার -->
    <div id="header-placeholder"></div>

    <main class="flex-grow">
        <!-- হিরো সেকশন -->
        <section class="bg-gray-900 text-white py-12 px-4 text-center border-b-4 border-red-600">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-3xl md:text-5xl font-extrabold mb-3">যোগাযোগ করুন</h1>
                <p class="text-gray-300 font-medium">যেকোনো প্রয়োজনে আমাদের সাথে সরাসরি কল বা হোয়াটসঅ্যাপে মেসেজ করুন।</p>
            </div>
        </section>

        <div class="max-w-3xl mx-auto px-4 py-12">
            
            <!-- সরাসরি কল বাটন -->
            <div class="flex justify-center mb-12">
                <a href="tel:01917079156" class="bg-red-600 text-white px-10 py-4 rounded-full font-bold text-xl hover:bg-red-700 transition shadow-lg shadow-red-200 flex items-center gap-3">
                    <i class="fa-solid fa-phone-volume animate-pulse"></i> সরাসরি কল করুন
                </a>
            </div>

            <!-- হোয়াটসঅ্যাপ ফর্ম -->
            <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl border border-gray-100 relative overflow-hidden">
                <!-- ব্যাকগ্রাউন্ড ডেকোরেশন -->
                <div class="absolute -right-10 -top-10 text-green-50 opacity-40 pointer-events-none">
                    <i class="fa-brands fa-whatsapp text-[200px]"></i>
                </div>

                <div class="relative z-10">
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">হোয়াটসঅ্যাপে মেসেজ পাঠান</h2>
                    <p class="text-gray-500 text-sm mb-8 text-center border-b-2 border-green-100 pb-4">নিচের ফর্মটি পূরণ করে বাটনে ক্লিক করলে আপনার মেসেজটি সরাসরি আমাদের হোয়াটসঅ্যাপে চলে আসবে।</p>
                    
                    <form id="whatsappForm" onsubmit="sendToWhatsApp(event)" class="space-y-5">
                        <div class="grid md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">আপনার নাম <span class="text-red-500">*</span></label>
                                <input type="text" id="waName" required placeholder="আপনার পূর্ণ নাম" class="w-full border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">মোবাইল নম্বর <span class="text-red-500">*</span></label>
                                <input type="tel" id="waPhone" required placeholder="আপনার মোবাইল নম্বর" class="w-full border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">বিষয় <span class="text-red-500">*</span></label>
                            <select id="waSubject" required class="w-full border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50">
                                <option value="" disabled selected>মেসেজের বিষয় নির্বাচন করুন</option>
                                <option value="রক্তের আবেদন">রক্তের আবেদন</option>
                                <option value="রক্তদাতা নিবন্ধন বিষয়ে">রক্তদাতা নিবন্ধন বিষয়ে</option>
                                <option value="স্বেচ্ছাসেবক হিসেবে যুক্ত হওয়া">স্বেচ্ছাসেবক হিসেবে যুক্ত হওয়া</option>
                                <option value="অনুদান বা আর্থিক সহায়তা">অনুদান বা আর্থিক সহায়তা</option>
                                <option value="অন্যান্য তথ্য জানা">অন্যান্য তথ্য জানা</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">বিস্তারিত বার্তা <span class="text-red-500">*</span></label>
                            <textarea id="waMessage" required rows="4" placeholder="আপনার মেসেজ এখানে বিস্তারিত লিখুন..." class="w-full border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 resize-none"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-[#25D366] text-white font-bold text-lg py-4 rounded-xl hover:bg-green-600 transition shadow-lg shadow-green-200 flex justify-center items-center gap-2 mt-4">
                            <i class="fa-brands fa-whatsapp text-2xl"></i> হোয়াটসঅ্যাপে পাঠান
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- ফুটার -->
    <div id="footer-placeholder"></div>
    
    <!-- স্ক্রিপ্টস -->
    <script src="script.js?v=2"></script>
    <script>
        function sendToWhatsApp(event) {
            event.preventDefault();

            const name = document.getElementById('waName').value;
            const phone = document.getElementById('waPhone').value;
            const subject = document.getElementById('waSubject').value;
            const message = document.getElementById('waMessage').value;

            // হোয়াটসঅ্যাপ নম্বর (কান্ট্রি কোড সহ)
            const whatsappNumber = "8801917079156"; 

            // মেসেজ ফরম্যাট
            const text = `আসসালামু আলাইকুম। আমি ওয়েবসাইট থেকে যোগাযোগ করছি।\n\n*নাম:* ${name}\n*মোবাইল:* ${phone}\n*বিষয়:* ${subject}\n\n*বিস্তারিত বার্তা:*\n${message}`;

            // URL এনকোডিং
            const encodedText = encodeURIComponent(text);
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedText}`;

            // হোয়াটসঅ্যাপ ওপেন করা
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
