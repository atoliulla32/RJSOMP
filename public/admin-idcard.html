/* =========================================================
   LOAD FIREBASE DATA
   ========================================================= */

async function fetchAndMergeData(){

try{

const volSnap=
await getDocs(collection(db,"volunteers"));

const donSnap=
await getDocs(collection(db,"blood_donors"));

const memSnap=
await getDocs(collection(db,"members"));


let usersMap=new Map();


function processDoc(docSnap,roleName){

docSnap.forEach(d=>{

const data=d.data();

const phone=
data.phone ||
"NoPhone_"+d.id;


if(usersMap.has(phone)){

const existing=usersMap.get(phone);


if(!existing.roles.includes(roleName)){

existing.roles.push(roleName);

}


if(
!existing.photo &&
data.profileImageUrl
){

existing.photo=data.profileImageUrl;

}


if(!existing.address){

existing.address=[
data.village,
data.upazila,
data.district
]
.filter(Boolean)
.join(", ");

}


}else{


const fullAddress=[
data.village,
data.upazila,
data.district
]
.filter(Boolean)
.join(", ");


let secretData=
data.secretCode ||
data.secretPin;


if(!secretData){

secretData=phone.slice(-4);

}


const dynamicId=
"RJF-"+secretData;


usersMap.set(phone,{

id:d.id,

name:data.name || "Unknown",

phone:phone,

blood:data.bloodGroup || "N/A",

address:fullAddress,

idNo:dynamicId,

photo:
data.profileImageUrl ||
"https://via.placeholder.com/300",

roles:[roleName]

});

}

});

}


processDoc(volSnap,"Volunteer");
processDoc(donSnap,"Blood Donor");
processDoc(memSnap,"Member");


mergedUsers=
Array.from(usersMap.values());


document.getElementById("totalUsers").innerText=
mergedUsers.length;


renderUsers(mergedUsers);


}catch(e){

console.error(e);

document.getElementById("users-grid").innerHTML=`

<div class="col-span-full text-center py-10 text-red-600 font-bold">

ডাটাবেজ থেকে তথ্য আনতে সমস্যা হয়েছে!

</div>

`;

}

}

title="আইডি কার্ড তৈরি করুন">

`;

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   SEARCH
   ========================================================= */

window.filterUsers=function(){

const txt=
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();


const filtered=
mergedUsers.filter(u=>

String(u.name||"")
.toLowerCase()
.includes(txt)

||

String(u.phone||"")
.includes(txt)

||

String(u.idNo||"")
.toLowerCase()
.includes(txt)

);


renderUsers(filtered);

};

window.openIdModal=function(dataStr){

const u=
JSON.parse(
decodeURIComponent(dataStr)

document.getElementById("edit_name").value=
u.name || "";

document.getElementById("edit_role").value=
u.roles.join(", ");

document.getElementById("edit_blood").value=
u.blood || "N/A";

document.getElementById("edit_idno").value=
u.idNo || "";

document.getElementById("edit_phone").value=
u.phone || "";

document.getElementById("edit_address").value=
u.address || "";

document.getElementById("edit_president").value=
defaultPresident;


document.getElementById("c_photo").src=
u.photo || "https://via.placeholder.com/300";


const modal=
document.getElementById("idCardModal");

const content=
document.getElementById("idCardModalContent");


modal.classList.remove("hidden");


setTimeout(()=>{

modal.classList.remove("opacity-0");

content.classList.remove("scale-95");

},10);

};


/* =========================================================
   CLOSE MODAL
   ========================================================= */

window.closeModal=function(){

const modal=
document.getElementById("idCardModal");

const content=
document.getElementById("idCardModalContent");


modal.classList.add("opacity-0");

content.classList.add("scale-95");


setTimeout(()=>{

modal.classList.add("hidden");

},300);

};


/* =========================================================

window.changeIdPhoto=function(input){

if(
input.files &&
input.files[0]

const reader=
new FileReader();


reader.onload=function(e){

document.getElementById("c_photo").src=
e.target.result;

};


reader.readAsDataURL(
input.files[0]
);

}

};

/* =========================================================
   DOWNLOAD FRONT + BACK
   ========================================================= */

window.processCardAction=async function(){

const button=
document.getElementById("downloadImgBtn");

const oldText=
button.innerHTML;


button.disabled=true;

button.innerHTML=`

<i class="fas fa-spinner fa-spin"></i>

কার্ড তৈরি হচ্ছে...

`;


let container=null;


try{


/* CREATE RENDER CONTAINER */

container=
document.createElement("div");


container.style.position="fixed";
container.style.left="-10000px";
container.style.top="0";
container.style.width="700px";
container.style.background="#fff";
container.style.zIndex="-9999";


container.innerHTML=
getCardTemplateHTML();


document.body.appendChild(container);


/* WAIT FOR IMAGES */

await waitForImages(container);


/* EXTRA TIME FOR FONTS */

await new Promise(
resolve=>setTimeout(resolve,700)
);


/* FIND CARDS */

const front=
container.querySelector("#export-front");

const back=
container.querySelector("#export-back");


if(!front || !back){

throw new Error(
"Card elements not found"
);

}


/* =========================================================
   RENDER FRONT
   ========================================================= */

const frontCanvas=
await html2canvas(
front,
{
scale:2,
useCORS:true,
allowTaint:false,
backgroundColor:"#ffffff",
logging:false,
imageTimeout:15000
}
);


/* =========================================================
   RENDER BACK
   ========================================================= */

const backCanvas=
await html2canvas(
back,
{
scale:2,
useCORS:true,
allowTaint:false,
backgroundColor:"#000000",
logging:false,
imageTimeout:15000
}
);


/* =========================================================
   CREATE COMBINED IMAGE
   ========================================================= */

const gap=40;

const combinedCanvas=
document.createElement("canvas");


combinedCanvas.width=
frontCanvas.width+
backCanvas.width+
gap*2;


combinedCanvas.height=
Math.max(
frontCanvas.height,
backCanvas.height
)+gap*2;


const ctx=
combinedCanvas.getContext("2d");


/* Background */

ctx.fillStyle="#fce8e5";

ctx.fillRect(
0,
0,
combinedCanvas.width,
combinedCanvas.height
);


/* FRONT */

ctx.drawImage(
frontCanvas,
gap,
gap
);


/* BACK */

ctx.drawImage(
backCanvas,
frontCanvas.width+gap*2,
gap
);


/* =========================================================
   DOWNLOAD
   ========================================================= */

const userName=
document.getElementById("edit_name")
.value
.trim()
.replace(/[\\/:*?"<>|]/g,"_");


const fileName=
`Rokttojoddha_ID_Card_${userName || "Member"}.jpg`;


const dataURL=
combinedCanvas.toDataURL(
"image/jpeg",
0.95
);


/* Use Blob download */

const blob=
await (
await fetch(dataURL)
).blob();


const blobUrl=
URL.createObjectURL(blob);


const link=
document.createElement("a");


link.href=blobUrl;

link.download=fileName;

link.style.display="none";


document.body.appendChild(link);

link.click();

document.body.removeChild(link);


setTimeout(
()=>{
URL.revokeObjectURL(blobUrl);
},
3000
);


/* SUCCESS */

button.innerHTML=`

<i class="fas fa-check-circle"></i>

ডাউনলোড সম্পন্ন হয়েছে

`;


setTimeout(
()=>{
button.innerHTML=oldText;
},
2000
);


}catch(error){

console.error(
"ID CARD DOWNLOAD ERROR:",
error
);


alert(
"কার্ড তৈরি করতে সমস্যা হয়েছে।\n\n"+
"সম্ভব হলে ছবিটি আবার নির্বাচন করে চেষ্টা করুন।"
);


button.innerHTML=oldText;


}finally{


if(container){

container.remove();

}


button.disabled=false;

}

};


/* =========================================================
   WAIT FOR IMAGES
   ========================================================= */

async function waitForImages(container){

const images=
Array.from(
container.querySelectorAll("img")
);


await Promise.all(

images.map(img=>{

return new Promise(resolve=>{

if(img.complete){

resolve();

return;

}


img.onload=resolve;

img.onerror=resolve;


setTimeout(
resolve,
15000
);

});

})

);

}
