/* =====================================================

function alert(msg) {
    let t = document.getElementById("appToast");
    if (!t) {
        t = document.createElement("div");
        t.id = "appToast";
        t.className = "fixed bottom-5 right-5 z-[9999] bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl font-bold text-sm transition-opacity duration-300";
        document.body.appendChild(t);
    }
    t.textContent = String(msg || "");
    t.style.opacity = "1";
    t.style.display = "block";
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => {
        t.style.opacity = "0";
        setTimeout(() => { t.style.display = "none"; }, 300);
    }, 3000);
}

function showPage(){

function showStartupError(message){

/* =====================================================
   LOAD IMAGE SAFELY
===================================================== */

function loadImage(src){
    return new Promise((resolve,reject)=>{
        if(!src){ reject(new Error("No image")); return; }
        const img = new Image();
        img.crossOrigin = "anonymous";
        let finished = false;
        const timer = setTimeout(()=>{
            if(!finished){ finished = true; reject(new Error("Image timeout")); }
        },7000);

        img.onload = ()=>{
            if(finished) return;
            finished = true;
            clearTimeout(timer);
            resolve(img);
        };

        img.onerror = ()=>{
            if(finished) return;
            finished = true;
            clearTimeout(timer);
            reject(new Error("Image load failed"));
        };
        img.src = src;
    });
}


/* =====================================================
   FIREBASE DATA
===================================================== */

async function fetchAndMergeData(){
    try{
        const volSnap = await getDocs(collection(db,"volunteers"));
        const donSnap = await getDocs(collection(db,"blood_donors"));
        const memSnap = await getDocs(collection(db,"members"));

        const usersMap = new Map();

        function processDoc(snap, roleName){
            snap.forEach(d=>{
                const data = d.data() || {};
                const phone = String(data.phone || "NoPhone_" + d.id);

                const pick = (...keys) => {
                    for (const key of keys) {
                        const value = data[key];
                        if (value !== undefined && value !== null && value !== "") {
                            if (typeof value.toDate === "function") {
                                try {
                                    const date = value.toDate();
                                    return date.toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"});
                                } catch (_) {}
                            }
                            return String(value);
                        }
                    }
                    return "";
                };
                const photo = pick("profileImageUrl", "photoURL", "photoUrl", "imageUrl", "photo", "image");
                const address = [data.village, data.upazila, data.district].filter(Boolean).join(", ");
                if(usersMap.has(phone)){
                    const existing = usersMap.get(phone);
                    if(!existing.roles.includes(roleName)){ existing.roles.push(roleName); }
                    if(!existing.photo && photo){ existing.photo = photo; }
                    ["father","mother","dob","email"].forEach(k => { if(!existing[k]) existing[k] = ({father:pick("fatherName","father","fathersName","father_name"), mother:pick("motherName","mother","mothersName","mother_name"), dob:pick("dob","dateOfBirth","birthDate","birth_date","birthday"), email:pick("email","gmail","emailAddress","email_address","mail")})[k]; });
                    if(!existing.address) existing.address = address;
                }else{
                    let secretData = data.secretCode || data.secretPin || phone.slice(-4);
                    usersMap.set(phone, {
                        id:d.id, name:pick("name","fullName") || "Unknown", phone:phone,
                        blood:pick("bloodGroup","blood_group","blood") || "N/A",
                        address:address, idNo:"RSMP-" + secretData,
                        photo:photo, father:pick("fatherName","father","fathersName","father_name"),
                        mother:pick("motherName","mother","mothersName","mother_name"),
                        dob:pick("dob","dateOfBirth","birthDate","birth_date","birthday"),
                        email:pick("email","gmail","emailAddress","email_address","mail"),
                        roles:[roleName]
                    });
                }
            });
        }

        processDoc(volSnap,"Volunteer");
        processDoc(donSnap,"Blood Donor");
        processDoc(memSnap,"Member");

        mergedUsers = Array.from(usersMap.values());
        document.getElementById("totalUsers").innerText = mergedUsers.length;
        renderUsers(mergedUsers);

    }catch(error){
        console.error("Firestore data loading failed:", error);
        showPage();
        document.getElementById("users-grid").innerHTML = `
            <div class="col-span-full text-center py-10 bg-red-50 border border-red-200 rounded-xl p-4">
                <div class="text-red-600 text-4xl mb-3"><i class="fas fa-triangle-exclamation"></i></div>
                <p class="text-red-700 font-bold">ডাটাবেজ থেকে তথ্য আনতে সমস্যা হয়েছে!</p>
                <p class="text-red-600 text-sm mt-2">Firebase Authentication, Firestore Rules এবং নেটওয়ার্ক সংযোগ পরীক্ষা করুন।</p>
                <p class="text-gray-500 text-xs mt-2">${escapeHTML(error && error.message ? error.message : "Unknown error")}</p>
            </div>
        `;
    }
}

                <h3 class="font-bold text-gray-800 truncate leading-tight">${escapeHTML(u.name)}</h3>
                <p class="text-[11px] font-bold text-red-600 mt-1 truncate"><i class="fas fa-tag"></i> ${escapeHTML(roleString)}</p>
                <p class="text-[11px] font-bold text-gray-400 mt-0.5"><i class="fas fa-fingerprint"></i> ID: ${escapeHTML(u.idNo)}</p>
            </div>
            <button onclick="openIdModal('${dataString}')" class="shrink-0 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white border border-red-200 w-10 h-10 rounded-xl flex items-center justify-center transition shadow-sm" title="আইডি কার্ড তৈরি করুন">
                <i class="fas fa-address-card text-lg"></i>
            </button>
        </div>
        `;
    });
    grid.innerHTML = html;
};


/* =====================================================
   ESCAPE HTML
===================================================== */
function escapeHTML(value){
    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   SEARCH
===================================================== */
window.filterUsers = function(){
    const txt = document.getElementById("searchInput").value.toLowerCase().trim();
    const filtered = mergedUsers.filter(u=>{
        return (
            String(u.name || "").toLowerCase().includes(txt) ||
            String(u.phone || "").includes(txt) ||
            String(u.idNo || "").toLowerCase().includes(txt)
        );
    });
    renderUsers(filtered);
};


/* =====================================================
   OPEN MODAL
===================================================== */
window.openIdModal = function(dataStr){
    try{
        const u = JSON.parse(decodeURIComponent(dataStr));
        document.getElementById("edit_name").value = u.name || "";
        document.getElementById("edit_father").value = u.father || "";
        document.getElementById("edit_mother").value = u.mother || "";
        document.getElementById("edit_dob").value = u.dob || "";
        document.getElementById("edit_email").value = u.email || "";
        document.getElementById("edit_role").value = u.roles ? u.roles.join(", ") : "";
        document.getElementById("edit_blood").value = u.blood || "N/A";
        document.getElementById("edit_idno").value = u.idNo || "";
        document.getElementById("edit_phone").value = u.phone || "";
        document.getElementById("edit_address").value = u.address || "";
        document.getElementById("edit_president").value = u.president || DEFAULT_PRESIDENT;
        const todayStr = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
        document.getElementById("edit_issue_date").value = todayStr;

        currentPhoto = u.photo || "";
        document.getElementById("photoInput").value = "";

        const modal = document.getElementById("idCardModal");
        const content = document.getElementById("idCardModalContent");

        modal.classList.remove("hidden");
        setTimeout(()=>{
            modal.classList.remove("opacity-0");
            content.classList.remove("scale-95");
        },10);
    }catch(e){
        console.error(e);
        alert("তথ্য খোলার সময় সমস্যা হয়েছে।");
    }
};


/* =====================================================
   CLOSE MODAL
===================================================== */
window.closeModal = function(){
    const modal = document.getElementById("idCardModal");
    const content = document.getElementById("idCardModalContent");

    modal.classList.add("opacity-0");
    content.classList.add("scale-95");

    setTimeout(()=>{
        modal.classList.add("hidden");
    },300);
};


/* =====================================================
   CHANGE PHOTO
===================================================== */
window.changeIdPhoto = function(input){
    if(input.files && input.files[0]){
        const file = input.files[0];
        if(!file.type.startsWith("image/")){
            alert("শুধু ছবি নির্বাচন করুন।");
            input.value = "";
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e){ currentPhoto = e.target.result; };
        reader.readAsDataURL(file);
    }
};

let templateImage = null;

function loadTemplate() {
    return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => { templateImage = image; resolve(image); };
        image.onerror = () => reject(new Error("ID template image failed to load"));
        image.src = TEMPLATE_B64;
    });
}

function drawCover(ctx, x, y, w, h) {
    ctx.fillStyle = "#fafdff";
    ctx.fillRect(x, y, w, h);
}

function drawFitPhoto(ctx, image, x, y, w, h) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    if (image) {
        const scale = Math.max(w / image.width, h / image.height);
        const sw = image.width * scale, sh = image.height * scale;
        ctx.drawImage(image, x + (w-sw)/2, y + (h-sh)/2, sw, sh);
    } else {
        ctx.fillStyle = "#e5edf7";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#244a7d";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("PHOTO", x+w/2, y+h/2);
    }
    ctx.restore();
}

function drawValue(ctx, value, x, y, maxWidth, fontSize=34) {
    let size = fontSize;
    const text = String(value || "—");
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#101010";
    do {
        ctx.font = `600 ${size}px "Poppins", "Noto Sans Bengali", Arial, sans-serif`;
        if (ctx.measureText(text).width <= maxWidth || size <= 20) break;
        size -= 1;
    } while (size > 19);
    ctx.fillText(text, x, y, maxWidth);
}

async function getMemberPhoto() {
    if (!currentPhoto) return null;
    try { return await loadImage(currentPhoto); }
    catch (error) {
        console.warn("Member photo could not load:", error);
        return null;
    }
}

async function createFrontCard() {
    if (!templateImage) await loadTemplate();
    const W = 1024, H = 1536;
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(templateImage, 0, 0, W, H);

    // Clear only the example portrait interior; preserve its blue frame.
    drawCover(ctx, 75, 393, 292, 340);
    const photo = await getMemberPhoto();
    drawFitPhoto(ctx, photo, 76, 394, 290, 338);

    // Draw values directly over the cleaned template so the background logo watermark remains 100% visible.
    const fields = [
        ["edit_name", 410, 805, 545, 34],
        ["edit_father", 410, 868, 545, 34],
        ["edit_mother", 410, 930, 545, 34],
        ["edit_dob", 410, 992, 545, 34],
        ["edit_blood", 410, 1055, 545, 34],
        ["edit_phone", 410, 1118, 545, 34],
        ["edit_email", 410, 1182, 545, 30]
    ];
    fields.forEach(([id, x, y, width, size]) =>
        drawValue(ctx, document.getElementById(id)?.value.trim(), x, y, width, size)
    );

    // Replace member ID in the red footer pill without changing its shape.
    ctx.fillStyle = "#e50920";
    ctx.fillRect(65, 1447, 445, 42);
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 29px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Member ID: " + (document.getElementById("edit_idno").value || "RSMP-000"), 285, 1477, 315);

    // Draw Authorized Signature above the signature line (x=710..942, line at y=1407)
    const signText = (document.getElementById("edit_president")?.value || DEFAULT_PRESIDENT).trim();
    if (signText) {
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        let signSize = 34;
        do {
            ctx.font = `700 ${signSize}px 'Dancing Script', cursive, sans-serif`;
            if (ctx.measureText(signText).width <= 235 || signSize <= 20) break;
            signSize -= 1;
        } while (signSize > 20);
        ctx.fillText(signText, 826, 1394, 240);
        ctx.restore();
    }

    // Draw Date of Issue next to "Date of Issue:" (label ends at x=836, baseline y=1481)
    const issueDateText = (document.getElementById("edit_issue_date")?.value || new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })).trim();
    if (issueDateText) {
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.font = "600 22px 'Poppins', Arial, sans-serif";
        ctx.fillText(issueDateText, 846, 1481, 155);
        ctx.restore();
    }

    return canvas;
}

function downloadCanvas(canvas, filename) {
    return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
            if (!blob) { reject(new Error("Image conversion failed")); return; }
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = filename; a.style.display = "none";
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => { URL.revokeObjectURL(url); resolve(); }, 800);
        }, "image/jpeg", 0.96);
    });
}

window.processCardAction = async function() {
    const btn = document.getElementById("downloadImgBtn");
    const oldHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> সামনের কার্ড তৈরি হচ্ছে...';
    try {
        const front = await createFrontCard();
        const name = (document.getElementById("edit_name").value.trim() || "Member")
            .replace(/[\\/:*?"<>|]/g, "_");
        await downloadCanvas(front, "ID_Front_" + name + ".jpg");

        // Do not open a second tab after an await: Android browsers often
        // block that popup and show about:blank. The back side is downloaded
        // only when the user taps its dedicated direct link below.
        btn.innerHTML = '<i class="fas fa-check"></i> সামনের কার্ড ডাউনলোড হয়েছে';
        setTimeout(() => { btn.innerHTML = oldHTML; btn.disabled = false; }, 2200);
    } catch (error) {
        console.error("CARD ERROR:", error);
        alert("কার্ড তৈরি করা যায়নি। পেজটি HTTPS-এ খুলে আবার চেষ্টা করুন।");
        btn.innerHTML = oldHTML; btn.disabled = false;
    }
};

/* =====================================================
   FALLBACK COPY
===================================================== */
function fallbackCopy(text){
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.appendChild(textarea);
    textarea.select();
    try{
        document.execCommand("copy");
        alert("✅ তথ্য কপি হয়েছে!");
    }catch(e){
        alert("❌ তথ্য কপি করা সম্ভব হয়নি।");
    }
    document.body.removeChild(textarea);
}
