/* =====================================================
   LOAD IMAGE SAFELY
===================================================== */

function loadImage(src){

    return new Promise((resolve,reject)=>{

        if(!src){

            reject(
                new Error("No image")
            );

            return;

        }

        const img =
            new Image();

        img.crossOrigin =
            "anonymous";

        let finished = false;

        const timer =
            setTimeout(()=>{

                if(!finished){

                    finished = true;

                    reject(
                        new Error(
                            "Image timeout"
                        )
                    );

                }

            },7000);


        img.onload = ()=>{

            if(finished) return;

            finished = true;

            clearTimeout(timer);

            resolve(img);

        };


        img.onerror = ()=>{

            if(finished) return;

            finished = true;

            clearTimeout(timer);

            reject(
                new Error(
                    "Image load failed"
                )
            );

        };


        img.src = src;

    });

}


/* =====================================================
   FIREBASE DATA
===================================================== */

async function fetchAndMergeData(){

    try{

        const volSnap =
            await getDocs(
                collection(
                    db,
                    "volunteers"
                )
            );


        const donSnap =
            await getDocs(
                collection(
                    db,
                    "blood_donors"
                )
            );


        const memSnap =
            await getDocs(
                collection(
                    db,
                    "members"
                )
            );


        const usersMap =
            new Map();


        function processDoc(
            snap,
            roleName
        ){

            snap.forEach(d=>{

                const data =
                    d.data() || {};


                const phone =
                    String(
                        data.phone ||
                        "NoPhone_" +
                        d.id
                    );


                if(
                    usersMap.has(phone)
                ){

                    const existing =
                        usersMap.get(phone);


                    if(
                        !existing.roles.includes(
                            roleName
                        )
                    ){

                        existing.roles.push(
                            roleName
                        );

                    }


                    if(
                        !existing.photo &&
                        data.profileImageUrl
                    ){

                        existing.photo =
                            data.profileImageUrl;

                    }


                    if(
                        !existing.address
                    ){

                        existing.address =
                            [
                                data.village,
                                data.upazila,
                                data.district
                            ]
                            .filter(Boolean)
                            .join(", ");

                    }


                }else{

                    const address =
                        [
                            data.village,
                            data.upazila,
                            data.district
                        ]
                        .filter(Boolean)
                        .join(", ");


                    let secretData =
                        data.secretCode ||
                        data.secretPin;


                    if(!secretData){

                        secretData =
                            phone.slice(-4);

                    }


                    const dynamicId =
                        "RJF-" +
                        secretData;


                    usersMap.set(
                        phone,
                        {

                            id:d.id,

                            name:
                                data.name ||
                                "Unknown",

                            phone:phone,

                            blood:
                                data.bloodGroup ||
                                "N/A",

                            address:address,

                            idNo:
                                dynamicId,

                            photo:
                                data.profileImageUrl ||
                                "",

                            roles:[
                                roleName
                            ]

                        }
                    );

                }

            });

        }


        processDoc(
            volSnap,
            "Volunteer"
        );

        processDoc(
            donSnap,
            "Blood Donor"
        );

        processDoc(
            memSnap,
            "Member"
        );


        mergedUsers =
            Array.from(
                usersMap.values()
            );


        document.getElementById(
            "totalUsers"
        ).innerText =
            mergedUsers.length;


        renderUsers(
            mergedUsers
        );


    }catch(error){

        console.error(error);

        document.getElementById(
            "users-grid"
        ).innerHTML = `

            <div class="col-span-full text-center py-10">

                <div class="text-red-600 text-4xl mb-3">
                    <i class="fas fa-triangle-exclamation"></i>
                </div>

                <p class="text-red-600 font-bold">
                    ডাটাবেজ থেকে তথ্য আনতে সমস্যা হয়েছে!
                </p>

            </div>

        `;

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

    const filtered =
        mergedUsers.filter(u=>{

            return (

                String(u.name || "")
                    .toLowerCase()
                    .includes(txt)

                ||

                String(u.phone || "")
                    .includes(txt)

                ||

                String(u.idNo || "")
                    .toLowerCase()
                    .includes(txt)

            );

        });


    renderUsers(
        filtered
    );

};

/* =====================================================
   CANVAS HELPERS
===================================================== */

function roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r
){

    const radius =
        Math.min(
            r,
            w/2,
            h/2
        );


    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.arcTo(
        x+w,
        y,
        x+w,
        y+h,
        radius
    );

    ctx.arcTo(
        x+w,
        y+h,
        x,
        y+h,
        radius
    );

    ctx.arcTo(
        x,
        y+h,
        x,
        y,
        radius
    );

    ctx.arcTo(
        x,
        y,
        x+w,
        y,
        radius
    );

    ctx.closePath();

}


/* =====================================================
   TRIANGLE PATTERN
===================================================== */

function drawTrianglePattern(
    ctx,
    x,
    y,
    width,
    height,
    size,
    bgColor
){

    ctx.save();

    ctx.fillStyle =
        bgColor;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    ctx.fillStyle =
        "#ffffff";


    for(
        let row=0;
        row<Math.ceil(height/size);
        row++
    ){

        for(
            let col=0;
            col<Math.ceil(width/size);
            col++
        ){

            const px =
                x + col*size;

            const py =
                y + row*size;


            ctx.beginPath();

            ctx.moveTo(
                px,
                py
            );

            ctx.lineTo(
                px+size,
                py
            );

            ctx.lineTo(
                px,
                py+size
            );

            ctx.closePath();

            ctx.fill();


            ctx.beginPath();

            ctx.moveTo(
                px+size,
                py+size
            );

            ctx.lineTo(
                px+size,
                py
            );

            ctx.lineTo(
                px,
                py+size
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    ctx.restore();

}


/* =====================================================
   TEXT WRAP
===================================================== */

function wrapText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    lineHeight,
    maxLines=20
){

    text =
        String(text || "");


    const words =
        text.split(/\s+/);


    let line = "";

    let lines = [];


    for(
        let n=0;
        n<words.length;
        n++
    ){

        const testLine =
            line
            ? line + " " + words[n]
            : words[n];


        const metrics =
            ctx.measureText(
                testLine
            );


        if(
            metrics.width >
                maxWidth &&
            line
        ){

            lines.push(
                line
            );

            line =
                words[n];

            if(
                lines.length >=
                maxLines
            ){

                break;

            }

        }else{

            line =
                testLine;

        }

    }


    if(
        line &&
        lines.length < maxLines
    ){

        lines.push(
            line
        );

    }


    lines.forEach(
        (ln,i)=>{

            ctx.fillText(
                ln,
                x,
                y + i*lineHeight
            );

        }
    );


    return lines.length;

}

/* =====================================================
   DRAW CIRCLE PHOTO
===================================================== */

function drawCirclePhoto(
    ctx,
    img,
    cx,
    cy,
    radius
){

    ctx.save();


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.clip();


    if(img){

        const ratio =
            Math.max(
                radius*2/img.width,
                radius*2/img.height
            );


        const w =
            img.width*ratio;

        const h =
            img.height*ratio;


        ctx.drawImage(
            img,
            cx-w/2,
            cy-h/2,
            w,
            h
        );

    }else{

        ctx.fillStyle =
            "#f1f5f9";

        ctx.fillRect(
            cx-radius,
            cy-radius,
            radius*2,
            radius*2
        );


        ctx.fillStyle =
            "#94a3b8";

        ctx.font =
            "bold 55px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "👤",
            cx,
            cy
        );

    }


    ctx.restore();


    /* red outer circle */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius+12,
        0,
        Math.PI*2
    );

    ctx.strokeStyle =
        "#ef4444";

    ctx.lineWidth =
        14;

    ctx.stroke();

}

/* =====================================================
   DOWNLOAD CANVAS
===================================================== */

function downloadCanvas(
    canvas,
    filename
){

    return new Promise(
        resolve=>{

            canvas.toBlob(
                blob=>{

                    if(!blob){

                        throw new Error(
                            "Image conversion failed"
                        );

                    }


                    const url =
                        URL.createObjectURL(
                            blob
                        );


                    const a =
                        document.createElement(
                            "a"
                        );

                    a.href =
                        url;

                    a.download =
                        filename;

                    a.style.display =
                        "none";


                    document.body.appendChild(
                        a
                    );


                    a.click();


                    setTimeout(()=>{

                        document.body.removeChild(
                            a
                        );

                        URL.revokeObjectURL(
                            url
                        );

                        resolve();

                    },800);

                },
                "image/jpeg",
                0.95
            );

        }
    );

}

/* =====================================================
   FALLBACK COPY
===================================================== */

function fallbackCopy(text){

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;

    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";


    document.body.appendChild(
        textarea
    );


    textarea.select();


    try{

        document.execCommand(
            "copy"
        );

        alert(
            "✅ তথ্য কপি হয়েছে!"
        );

    }catch(e){

        alert(
            "❌ তথ্য কপি করা সম্ভব হয়নি।"
        );

    }


    document.body.removeChild(
        textarea
    );

}
