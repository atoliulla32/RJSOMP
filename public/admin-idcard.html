/* =========================================================

async function fetchAndMergeData(){

    try{

        const volSnap =
        await getDocs(collection(db,"volunteers"));

        const donSnap =
        await getDocs(collection(db,"blood_donors"));

        const memSnap =
        await getDocs(collection(db,"members"));


        const usersMap = new Map();


        function processDoc(snapshot, roleName){

            snapshot.forEach(d => {

                const data = d.data();

                const phone =
                data.phone ||
                ("NoPhone_" + d.id);


                if(usersMap.has(phone)){

                    const existing =
                    usersMap.get(phone);


                    if(!existing.roles.includes(roleName)){

                        existing.roles.push(roleName);

                    }


                    if(
                        !existing.photo &&
                        data.profileImageUrl
                    ){

                        existing.photo =
                        data.profileImageUrl;

                    }


                    if(!existing.address){

                        existing.address =
                        [
                            data.village,
                            data.upazila,
                            data.district
                        ]
                        .filter(Boolean)
                        .join(", ");

                    }

                }else{

                    const fullAddress =
                    [
                        data.village,
                        data.upazila,
                        data.district
                    ]
                    .filter(Boolean)
                    .join(", ");


                    let secretData =
                    data.secretCode ||
                    data.secretPin;


                    if(!secretData){

                        secretData =
                        phone.slice(-4);

                    }


                    const dynamicId =
                    "RJF-" + secretData;


                    usersMap.set(phone,{

                        id:d.id,

                        name:
                        data.name ||
                        "Unknown",

                        phone:phone,

                        blood:
                        data.bloodGroup ||
                        "N/A",

                        address:
                        fullAddress ||
                        "N/A",

                        idNo:
                        dynamicId,

                        photo:
                        data.profileImageUrl ||
                        "https://via.placeholder.com/300",

                        roles:
                        [roleName]

                    });

                }

            });

        }


        processDoc(volSnap,"Volunteer");

        processDoc(donSnap,"Blood Donor");

        processDoc(memSnap,"Member");


        mergedUsers =
        Array.from(usersMap.values());


        document.getElementById(
            "totalUsers"
        ).innerText =
        mergedUsers.length;


        renderUsers(mergedUsers);


    }catch(error){

        console.error(error);

        document.getElementById(
            "users-grid"
        ).innerHTML = `

            <div class="col-span-full text-center py-10
            text-red-600 font-bold">

                ডাটাবেজ থেকে তথ্য আনতে সমস্যা হয়েছে!

            </div>

        `;

    }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================================================
   LOAD IMAGE SAFELY
========================================================= */

function loadImage(src){

    return new Promise((resolve,reject) => {

        const img =
        new Image();


        img.crossOrigin =
        "anonymous";


        img.onload = () => {

            resolve(img);

        };


        img.onerror = () => {

            reject(
                new Error(
                    "Image load failed"
                )
            );

        };


        img.src = src;

    });

}


/* =========================================================
   DRAW TRIANGLE PATTERN
========================================================= */

function drawPattern(
    ctx,
    x,
    y,
    width,
    height,
    bgColor="#ef4444",
    triangleColor="#ffffff"
){

    ctx.save();

    ctx.fillStyle =
    bgColor;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    const size = 32;


    ctx.fillStyle =
    triangleColor;


    for(
        let yy=y;
        yy<y+height;
        yy+=size
    ){

        for(
            let xx=x;
            xx<x+width;
            xx+=size
        ){

            ctx.beginPath();

            ctx.moveTo(
                xx,
                yy
            );

            ctx.lineTo(
                xx+size,
                yy
            );

            ctx.lineTo(
                xx,
                yy+size
            );

            ctx.closePath();

            ctx.fill();


            ctx.beginPath();

            ctx.moveTo(
                xx+size,
                yy+size
            );

            ctx.lineTo(
                xx+size,
                yy
            );

            ctx.lineTo(
                xx,
                yy+size
            );

            ctx.closePath();

            ctx.fill();

        }

    }

    ctx.restore();

}


/* =========================================================
   DRAW CENTER CROPPED IMAGE
========================================================= */

function drawCoverImage(
    ctx,
    img,
    x,
    y,
    width,
    height
){

    const ratio =
    Math.max(
        width / img.width,
        height / img.height
    );


    const newWidth =
    img.width * ratio;


    const newHeight =
    img.height * ratio;


    const dx =
    x +
    (width-newWidth)/2;


    const dy =
    y +
    (height-newHeight)/2;


    ctx.drawImage(
        img,
        dx,
        dy,
        newWidth,
        newHeight
    );

}


/* =========================================================
   WRAP TEXT
========================================================= */

function wrapText(
    ctx,
    text,
    maxWidth
){

    const words =
    String(text || "")
    .split(/\s+/);


    const lines = [];

    let line = "";


    for(
        let i=0;
        i<words.length;
        i++
    ){

        const test =
        line
        ? line+" "+words[i]
        : words[i];


        const width =
        ctx.measureText(test).width;


        if(
            width > maxWidth &&
            line
        ){

            lines.push(line);

            line =
            words[i];

        }else{

            line =
            test;

        }

    }


    if(line){

        lines.push(line);

    }


    return lines;

}


/* =========================================================
   DRAW FRONT CARD
========================================================= */

async function createFrontCanvas(){

    const W = 680;
    const H = 1060;


    const canvas =
    document.createElement("canvas");


    canvas.width=W;
    canvas.height=H;


    const ctx =
    canvas.getContext("2d");


    /* WHITE BACKGROUND */

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* LEFT PATTERN */

    drawPattern(
        ctx,
        0,
        0,
        190,
        H,
        "#ef4444",
        "#ffffff"
    );


    /* WHITE BODY */

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
        190,
        0,
        W-190,
        H
    );


    /* LOGO */

    try{

        const logo =
        await loadImage(
            LOGO_URL
        );


        ctx.save();

        ctx.beginPath();

        ctx.arc(
            95,
            100,
            48,
            0,
            Math.PI*2
        );

        ctx.closePath();

        ctx.clip();


        drawCoverImage(
            ctx,
            logo,
            47,
            52,
            96,
            96
        );


        ctx.restore();


    }catch(e){

        console.warn(
            "Logo load failed",
            e
        );

    }


    /* ORGANIZATION NAME */

    ctx.fillStyle="#111111";

    ctx.textAlign="right";

    ctx.font=
    "800 31px Poppins, Arial";


    const orgLines=[
        "ROKTOJODDA SOMAJ O",
        "MANOB KOLLAYAN",
        "PARISHAD"
    ];


    let orgY=75;


    orgLines.forEach(line=>{

        ctx.fillText(
            line,
            645,
            orgY
        );

        orgY+=40;

    });


    /* PHOTO CIRCLE */

    let photoSrc =
    document.getElementById(
        "c_photo"
    ).src;


    let photo;


    try{

        photo =
        await loadImage(
            photoSrc
        );

    }catch(e){

        try{

            photo =
            await loadImage(
                "https://via.placeholder.com/500"
            );

        }catch(e2){

            photo=null;

        }

    }


    const photoCX=195;
    const photoCY=365;
    const photoR=145;


    /* RED OUTER CIRCLE */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        photoCX,
        photoCY,
        photoR+16,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#ef4444";

    ctx.fill();

    ctx.restore();


    /* WHITE BORDER */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        photoCX,
        photoCY,
        photoR,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#ffffff";

    ctx.fill();

    ctx.clip();


    if(photo){

        drawCoverImage(
            ctx,
            photo,
            photoCX-photoR,
            photoCY-photoR,
            photoR*2,
            photoR*2
        );

    }


    ctx.restore();


    /* PHOTO BORDER */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        photoCX,
        photoCY,
        photoR,
        0,
        Math.PI*2
    );

    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=7;

    ctx.stroke();

    ctx.restore();


    /* NAME */

    const name =
    document.getElementById(
        "edit_name"
    ).value ||
    "Member Name";


    ctx.textAlign="right";

    ctx.fillStyle="#111111";

    ctx.font=
    "800 43px Poppins, 'Noto Sans Bengali', sans-serif";


    let nameLines =
    wrapText(
        ctx,
        name.toUpperCase(),
        420
    );


    if(nameLines.length>2){

        nameLines =
        nameLines.slice(0,2);

    }


    let nameY=620;


    nameLines.forEach(line=>{

        ctx.fillText(
            line,
            645,
            nameY
        );

        nameY+=48;

    });


    /* ROLE */

    const role =
    document.getElementById(
        "edit_role"
    ).value ||
    "Volunteer";


    ctx.fillStyle="#555555";

    ctx.font=
    "600 27px Poppins, 'Noto Sans Bengali', sans-serif";


    ctx.fillText(
        role,
        645,
        nameY+8
    );


    /* ID */

    const idno =
    document.getElementById(
        "edit_idno"
    ).value ||
    "RJF-0000";


    ctx.fillStyle="#111111";

    ctx.font=
    "700 27px Poppins, Arial";


    ctx.fillText(
        "ID: "+idno,
        645,
        nameY+65
    );


    /* BLOOD */

    const blood =
    document.getElementById(
        "edit_blood"
    ).value ||
    "N/A";


    ctx.fillStyle="#ef4444";

    ctx.font=
    "800 35px Poppins, Arial";


    ctx.fillText(
        "🩸 "+blood,
        645,
        nameY+115
    );


    /* SIGNATURE */

    const president =
    document.getElementById(
        "edit_president"
    ).value ||
    DEFAULT_PRESIDENT;


    ctx.textAlign="right";

    ctx.fillStyle="#1e3a8a";

    ctx.font=
    "700 48px 'Dancing Script', cursive";


    ctx.fillText(
        president,
        645,
        970
    );


    /* SIGNATURE LINE */

    ctx.strokeStyle="#999999";

    ctx.lineWidth=2;


    ctx.beginPath();

    ctx.moveTo(
        425,
        982
    );

    ctx.lineTo(
        645,
        982
    );

    ctx.stroke();


    /* PRESIDENT */

    ctx.fillStyle="#555555";

    ctx.font=
    "800 18px Poppins, Arial";


    ctx.fillText(
        "PRESIDENT",
        645,
        1010
    );


    return canvas;

}


/* =========================================================
   DRAW BACK CARD
========================================================= */

async function createBackCanvas(){

    const W=680;
    const H=1060;


    const canvas =
    document.createElement("canvas");


    canvas.width=W;

    canvas.height=H;


    const ctx =
    canvas.getContext("2d");


    /* BLACK BACKGROUND */

    ctx.fillStyle="#000000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* RIGHT PATTERN */

    drawPattern(
        ctx,
        570,
        0,
        110,
        H,
        "#ef4444",
        "#000000"
    );


    /* LOGO */

    try{

        const logo =
        await loadImage(
            LOGO_URL
        );


        ctx.save();

        ctx.beginPath();

        ctx.arc(
            100,
            105,
            58,
            0,
            Math.PI*2
        );

        ctx.clip();


        drawCoverImage(
            ctx,
            logo,
            42,
            47,
            116,
            116
        );


        ctx.restore();

    }catch(e){

        console.warn(
            "Logo load failed",
            e
        );

    }


    /* TITLE */

    ctx.textAlign="left";

    ctx.fillStyle="#ffffff";

    ctx.font=
    "800 32px Poppins, Arial";


    ctx.fillText(
        "TERMS & CONDITIONS",
        42,
        225
    );


    /* TERMS */

    const terms=[

        "1. This ID Card is issued solely for authorized volunteer activities of Rokttojoddha Somaj o Manob Kollayan Parishad.",

        "2. This ID Card is the property of the organization. It must not be misused, transferred, or allowed to be used by any other person without authorization.",

        "3. This ID Card does not guarantee any employment, official position, salary, or financial benefit."

    ];


    let y=285;


    terms.forEach(term=>{

        ctx.fillStyle="#ffffff";

        ctx.font=
        "500 21px Poppins, Arial";


        const lines =
        wrapText(
            ctx,
            term,
            485
        );


        lines.forEach(line=>{

            ctx.fillText(
                line,
                42,
                y
            );

            y+=30;

        });


        y+=25;

    });


    /* NOTE */

    ctx.fillStyle="#fef08a";

    ctx.font=
    "700 20px Poppins, Arial";


    const note =
    "Note: This ID Card is valid only for authorized volunteer activities of the organization.";


    const noteLines =
    wrapText(
        ctx,
        note,
        485
    );


    noteLines.forEach(line=>{

        ctx.fillText(
            line,
            42,
            y
        );

        y+=29;

    });


    /* CONTACT SECTION */

    const contactY=850;


    ctx.fillStyle="#ffffff";

    ctx.font=
    "800 22px Poppins, Arial";


    ctx.fillText(
        "Mail",
        42,
        contactY
    );


    ctx.fillStyle="#cccccc";

    ctx.font=
    "500 20px Poppins, Arial";


    ctx.fillText(
        MAIL,
        42,
        contactY+32
    );


    /* NUMBER */

    const phone =
    document.getElementById(
        "edit_phone"
    ).value ||
    "N/A";


    ctx.fillStyle="#ffffff";

    ctx.font=
    "800 22px Poppins, Arial";


    ctx.fillText(
        "Number",
        42,
        contactY+80
    );


    ctx.fillStyle="#cccccc";

    ctx.font=
    "500 20px Poppins, Arial";


    ctx.fillText(
        phone,
        42,
        contactY+112
    );


    /* WEBSITE */

    ctx.fillStyle="#ffffff";

    ctx.font=
    "800 22px Poppins, Arial";


    ctx.fillText(
        "Website",
        42,
        contactY+160
    );


    ctx.fillStyle="#cccccc";

    ctx.font=
    "500 20px Poppins, Arial";


    ctx.fillText(
        WEBSITE,
        42,
        contactY+192
    );


    return canvas;

}

window.downloadCards = async function(){

    const button =
    document.getElementById(
        "downloadImgBtn"
    );


    const originalHTML =
    button.innerHTML;


    try{

        button.disabled=true;

        button.innerHTML=`

            <i class="fas fa-spinner fa-spin"></i>
            Front তৈরি হচ্ছে...

        `;


        /* Wait for fonts */

        if(document.fonts){

            try{

                await document.fonts.ready;

            }catch(e){}

        }


        const frontCanvas =
        await createFrontCanvas();


        button.innerHTML=`

            <i class="fas fa-spinner fa-spin"></i>
            Back তৈরি হচ্ছে...

        `;


        const backCanvas =
        await createBackCanvas();


        button.innerHTML=`

            <i class="fas fa-spinner fa-spin"></i>
            ডাউনলোড হচ্ছে...

        `;


        const name =
        document.getElementById(
            "edit_name"
        ).value
        .trim()
        .replace(/[\\/:*?"<>|]/g,"_")
        .replace(/\s+/g,"_") ||
        "Member";


        /* FRONT */

        await downloadCanvas(
            frontCanvas,
            "ID_Front_"+name+".jpg"
        );


        await sleep(700);


        /* BACK */

        await downloadCanvas(
            backCanvas,
            "ID_Back_"+name+".jpg"
        );


        button.innerHTML=`

            <i class="fas fa-check"></i>
            সফলভাবে ডাউনলোড হয়েছে

        `;


        setTimeout(()=>{

            button.innerHTML =
            originalHTML;

        },2000);


    }catch(error){

        console.error(
            "CARD DOWNLOAD ERROR:",
            error
        );


        alert(
            "কার্ড তৈরি করতে সমস্যা হয়েছে।\n\n"+
            "সম্ভবত সদস্যের ছবি বা লোগো লোড হতে সমস্যা হয়েছে।"+
            "\nইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।"
        );


        button.innerHTML =
        originalHTML;


    }finally{

        button.disabled=false;

    }

};


/* =========================================================
   DOWNLOAD CANVAS
========================================================= */

function downloadCanvas(
    canvas,
    filename
){

    return new Promise(resolve=>{

        canvas.toBlob(
            blob=>{

                if(!blob){

                    throw new Error(
                        "Canvas blob failed"
                    );

                }


                const url =
                URL.createObjectURL(
                    blob
                );


                const a =
                document.createElement("a");


                a.style.display="none";

                a.href=url;

                a.download=filename;


                document.body.appendChild(a);


                a.click();


                setTimeout(()=>{

                    document.body.removeChild(a);

                    URL.revokeObjectURL(url);

                    resolve();

                },500);

            },
            "image/jpeg",
            0.98
        );

    });

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms){

    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );

}

    document.getElementById(

    const address =
    document.getElementById(
        "edit_address"
    ).value;


    const president =
    document.getElementById(
        "edit_president"
    ).value ||
    DEFAULT_PRESIDENT;


    const textToCopy =

`🩸 রক্তযোদ্ধা আইডি কার্ডের তথ্য 🩸

👤 নাম: ${name}
🏷 পদবী: ${role}

📞 মোবাইল: ${phone}
📍 ঠিকানা: ${address}

🖋 সভাপতি: ${president}`;


    navigator.clipboard
    .writeText(textToCopy)
    .then(()=>{

        alert(
            "✅ আইডি কার্ডের সব তথ্য কপি হয়েছে!"
        );

    })
    .catch(()=>{

        const ta =
        document.createElement(
            "textarea"
        );


        ta.value =
        textToCopy;


        document.body.appendChild(ta);

        ta.select();

        document.execCommand(
            "copy"
        );

        document.body.removeChild(ta);


        alert(
            "✅ তথ্য কপি হয়েছে!"
        );

    });

};
