from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyDBB74MD8ZC1mUD787oqKqmXD-S4nb60yw",

    authDomain: "rjsomp.firebaseapp.com",

    projectId: "rjsomp",

    storageBucket: "rjsomp.firebasestorage.app",

    messagingSenderId: "1033528754332",

    appId: "1:1033528754332:web:a2dd02fc14096c1eeeed59"

};


const app =
    !getApps().length
        ? initializeApp(firebaseConfig)
        : getApp();


const auth = getAuth(app);

const db = getFirestore(app);



let mergedUsers = [];

let defaultPresident = "Kazi Ibrahim";



/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, (user) => {

    if (user) {

        document.documentElement.style.display = '';

        fetchAndMergeData();

    } else {

        window.top.location.href = "admin.html";

    }

});



/* =========================
   LOAD USERS
========================= */

async function fetchAndMergeData() {

    try {

        const volSnap =
            await getDocs(collection(db, "volunteers"));

        const donSnap =
            await getDocs(collection(db, "blood_donors"));

        const memSnap =
            await getDocs(collection(db, "members"));


        const usersMap = new Map();


        const processDoc = (docSnap, roleName) => {

            docSnap.forEach(d => {

                const data = d.data();


                let phone =
                    data.phone || "NoPhone_" + d.id;


                if (usersMap.has(phone)) {

                    const existing =
                        usersMap.get(phone);


                    if (!existing.roles.includes(roleName)) {

                        existing.roles.push(roleName);

                    }


                    if (
                        !existing.photo &&
                        data.profileImageUrl
                    ) {

                        existing.photo =
                            data.profileImageUrl;

                    }


                    if (!existing.address) {

                        existing.address =
                            [
                                data.village,
                                data.upazila,
                                data.district
                            ]
                            .filter(Boolean)
                            .join(", ");

                    }

                } else {

                    const fullAddress =
                        [
                            data.village,
                            data.upazila,
                            data.district
                        ]
                        .filter(Boolean)
                        .join(", ");


                    let secretData =
                        data.secretCode ||
                        data.secretPin;


                    if (!secretData) {

                        secretData =
                            phone.slice(-4);

                    }


                    const dynamicId =
                        "RJF-" + secretData;


                    usersMap.set(phone, {

                        id: d.id,

                        name:
                            data.name || "নাম নেই",

                        phone:
                            phone,

                        blood:
                            data.bloodGroup || "N/A",

                        address:
                            fullAddress || "ঠিকানা নেই",

                        idNo:
                            dynamicId,

                        photo:
                            data.profileImageUrl ||
                            "https://placehold.co/300x400/ffffff/999999?text=Photo",

                        roles:
                            [roleName]

                    });

                }

            });

        };


        processDoc(volSnap, "Volunteer");

        processDoc(donSnap, "Blood Donor");

        processDoc(memSnap, "Member");


        mergedUsers =
            Array.from(usersMap.values());


        document.getElementById(
            'totalUsers'
        ).innerText =
            mergedUsers.length;


        renderUsers(mergedUsers);


    } catch (e) {

        console.error(e);


        document.getElementById(
            'users-grid'
        ).innerHTML = `

            <div class="col-span-full text-center py-10 text-red-600 font-bold">

                ডাটাবেজ থেকে তথ্য আনতে সমস্যা হয়েছে!

            </div>

        `;

    }

}



/* =========================
   RENDER USERS
========================= */

window.renderUsers = (usersArray) => {

    const grid =
        document.getElementById('users-grid');


    if (usersArray.length === 0) {

        grid.innerHTML = `

            <div class="col-span-full text-center py-16">

                <p class="text-gray-500 font-bold">

                    কোনো সদস্য পাওয়া যায়নি!

                </p>

            </div>

        `;

        return;

    }


    let html = '';


    usersArray.forEach((u) => {

        const roleString =
            u.roles.join(", ");


        const safeDataStr =
            encodeURIComponent(
                JSON.stringify(u)
            );


        html += `

            <div
                class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex items-center gap-4 transition hover:shadow-md">

                <img
                    src="${escapeHtmlAttribute(u.photo)}"
                    class="w-16 h-16 rounded-full object-cover border-[3px] border-red-100 shadow-sm shrink-0"
                    onerror="this.src='https://placehold.co/300x400/ffffff/999999?text=Photo'">


                <div class="flex-grow min-w-0">

                    <h3 class="font-bold text-gray-800 truncate leading-tight">

                        ${escapeHtml(u.name)}

                    </h3>


                    <p class="text-[11px] font-bold text-red-600 mt-1 truncate">

                        <i class="fas fa-tag"></i>

                        ${escapeHtml(roleString)}

                    </p>


                    <p class="text-[11px] font-bold text-gray-400 mt-0.5">

                        <i class="fas fa-fingerprint"></i>

                        ID: ${escapeHtml(u.idNo)}

                    </p>

                </div>


                <button
                    onclick="openIdModal('${safeDataStr}')"
                    class="shrink-0 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white border border-red-200 w-10 h-10 rounded-xl flex items-center justify-center transition shadow-sm"
                    title="আইডি কার্ড তৈরি করুন">

                    <i class="fas fa-address-card text-lg"></i>

                </button>

            </div>

        `;

    });


    grid.innerHTML = html;

};



/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


function escapeHtmlAttribute(value) {

    return escapeHtml(value);

}



/* =========================
   SEARCH
========================= */

window.filterUsers = () => {

    const txt =
        document
            .getElementById('searchInput')
            .value
            .toLowerCase()
            .trim();


    const filtered =
        mergedUsers.filter(u =>

            String(u.name || '')
                .toLowerCase()
                .includes(txt)

            ||

            String(u.phone || '')
                .includes(txt)

            ||

            String(u.idNo || '')
                .toLowerCase()
                .includes(txt)

        );


    renderUsers(filtered);

};



/* =========================
   OPEN MODAL
========================= */

window.openIdModal = (dataStr) => {

    try {

        const u =
            JSON.parse(
                decodeURIComponent(dataStr)
            );


        document.getElementById(
            'edit_name'
        ).value =
            u.name || '';


        document.getElementById(
            'edit_role'
        ).value =
            u.roles.join(", ");


        document.getElementById(
            'edit_blood'
        ).value =
            u.blood || 'N/A';


        document.getElementById(
            'edit_idno'
        ).value =
            u.idNo || '';


        document.getElementById(
            'edit_phone'
        ).value =
            u.phone || '';


        document.getElementById(
            'edit_address'
        ).value =
            u.address || '';


        document.getElementById(
            'edit_president'
        ).value =
            defaultPresident;


        document.getElementById(
            'c_photo'
        ).src =
            u.photo ||
            'https://placehold.co/300x400/ffffff/999999?text=Photo';


        document.getElementById(
            'newPhotoInput'
        ).value = '';


        const modal =
            document.getElementById(
                'idCardModal'
            );


        const content =
            document.getElementById(
                'idCardModalContent'
            );


        modal.classList.remove('hidden');


        setTimeout(() => {

            modal.classList.remove('opacity-0');

            content.classList.remove('scale-95');

        }, 10);


    } catch (error) {

        console.error(error);

        alert("সদস্যের তথ্য খোলার সময় সমস্যা হয়েছে।");

    }

};



/* =========================
   CLOSE MODAL
========================= */

window.closeModal = () => {

    const modal =
        document.getElementById(
            'idCardModal'
        );


    const content =
        document.getElementById(
            'idCardModalContent'
        );


    modal.classList.add('opacity-0');

    content.classList.add('scale-95');


    setTimeout(() => {

        modal.classList.add('hidden');

    }, 300);

};



/* =========================
   CHANGE PHOTO
========================= */

window.changeIdPhoto = (input) => {

    if (
        input.files &&
        input.files[0]
    ) {

        const file =
            input.files[0];


        if (!file.type.startsWith('image/')) {

            alert("শুধু ছবি নির্বাচন করুন।");

            input.value = '';

            return;

        }


        const reader =
            new FileReader();


        reader.onload = function(e) {

            document.getElementById(
                'c_photo'
            ).src =
                e.target.result;

        };


        reader.readAsDataURL(file);

    }

};

/* =========================================================
   IMAGE LOAD HELPER
========================================================= */

function waitForImages(container) {

    const images =
        Array.from(
            container.querySelectorAll('img')
        );


    if (!images.length) {

        return Promise.resolve();

    }


    return Promise.all(

        images.map(img => {

            return new Promise(resolve => {

                let done = false;


                const finish = () => {

                    if (done) return;

                    done = true;

                    resolve();

                };


                if (img.complete) {

                    finish();

                } else {

                    img.onload = finish;

                    img.onerror = finish;

                    setTimeout(
                        finish,
                        4000
                    );

                }

            });

        })

    );

}



/* =========================================================
   DOWNLOAD
========================================================= */

window.processCardAction = async (actionType) => {

    const btnDown =
        document.getElementById(
            'downloadImgBtn'
        );


    const originalDownText =
        btnDown.innerHTML;


    btnDown.innerHTML = `

        <i class="fas fa-spinner fa-spin"></i>

        কার্ড তৈরি হচ্ছে...

    `;


    btnDown.disabled = true;


    let container = null;


    try {

        /* ===============================
           CREATE RENDER CONTAINER
        =============================== */

        container =
            document.createElement('div');


        container.style.position =
            'fixed';

        container.style.left =
            '-100000px';

        container.style.top =
            '0';

        container.style.width =
            '340px';

        container.style.height =
            '1060px';

        container.style.background =
            '#ffffff';

        container.style.zIndex =
            '-99999';


        document.body.appendChild(
            container
        );


        /* ===============================
           INSERT CARD
        =============================== */

        container.innerHTML =
            getCardTemplateHTML();


        const front =
            container.querySelector(
                '#export-front'
            );


        const back =
            container.querySelector(
                '#export-back'
            );


        if (!front || !back) {

            throw new Error(
                "Card template তৈরি হয়নি"
            );

        }


        /* ===============================
           WAIT FOR IMAGES
        =============================== */

        await waitForImages(
            container
        );


        /* ===============================
           SMALL DELAY
        =============================== */

        await new Promise(
            resolve =>
                setTimeout(resolve, 500)
        );


        /* ===============================
           FRONT CANVAS
        =============================== */

        const frontCanvas =
            await html2canvas(
                front,
                {
                    scale: 2,

                    backgroundColor:
                        '#ffffff',

                    logging: false,

                    useCORS: true,

                    allowTaint: false,

                    imageTimeout: 5000,

                    foreignObjectRendering:
                        false,

                    removeContainer:
                        true
                }
            );


        /* ===============================
           BACK CANVAS
        =============================== */

        const backCanvas =
            await html2canvas(
                back,
                {
                    scale: 2,

                    backgroundColor:
                        '#000000',

                    logging: false,

                    useCORS: true,

                    allowTaint: false,

                    imageTimeout: 5000,

                    foreignObjectRendering:
                        false,

                    removeContainer:
                        true
                }
            );


        /* ===============================
           USER NAME
        =============================== */

        const userName =
            document.getElementById(
                'edit_name'
            ).value.trim()
            || 'Member';


        const safeName =
            userName
                .replace(
                    /[\\/:*?"<>|]/g,
                    '_'
                )
                .replace(
                    /\s+/g,
                    '_'
                );


        /* ===============================
           FRONT DOWNLOAD
        =============================== */

        const frontBlob =
            await canvasToBlob(
                frontCanvas
            );


        if (!frontBlob) {

            throw new Error(
                "Front image তৈরি হয়নি"
            );

        }


        downloadBlob(
            frontBlob,
            `ID_Front_${safeName}.jpg`
        );


        /* ===============================
           WAIT BEFORE SECOND DOWNLOAD
        =============================== */

        await new Promise(
            resolve =>
                setTimeout(resolve, 1200)
        );


        /* ===============================
           BACK DOWNLOAD
        =============================== */

        const backBlob =
            await canvasToBlob(
                backCanvas
            );


        if (!backBlob) {

            throw new Error(
                "Back image তৈরি হয়নি"
            );

        }


        downloadBlob(
            backBlob,
            `ID_Back_${safeName}.jpg`
        );


        /* ===============================
           SUCCESS
        =============================== */

        setTimeout(() => {

            alert(
                "✅ আইডি কার্ড সফলভাবে তৈরি হয়েছে!\n\n" +
                "Front এবং Back দুইটি JPG ফাইল ডাউনলোড হয়েছে।"
            );

        }, 300);


    } catch (error) {

        console.error(
            "ID CARD DOWNLOAD ERROR:",
            error
        );


        alert(
            "❌ আইডি কার্ড ডাউনলোড করা যায়নি!\n\n" +
            "সমস্যাটি বিস্তারিত জানতে Browser Console দেখুন।\n\n" +
            "Error: " +
            (error.message || error)
        );


    } finally {

        /* ===============================
           REMOVE TEMP CONTAINER
        =============================== */

        if (
            container &&
            container.parentNode
        ) {

            container.parentNode.removeChild(
                container
            );

        }


        /* ===============================
           RESTORE BUTTON
        =============================== */

        btnDown.innerHTML =
            originalDownText;


        btnDown.disabled = false;

    }

};



/* =========================================================
   CANVAS TO BLOB
========================================================= */

function canvasToBlob(canvas) {

    return new Promise(resolve => {

        canvas.toBlob(
            blob => resolve(blob),
            'image/jpeg',
            0.95
        );

    });

}



/* =========================================================
   DOWNLOAD BLOB
========================================================= */

function downloadBlob(blob, filename) {

    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement('a');


    link.href =
        url;


    link.download =
        filename;


    link.style.display =
        'none';


    document.body.appendChild(
        link
    );


    link.click();


    setTimeout(() => {

        link.remove();

        URL.revokeObjectURL(url);

    }, 2000);

}
