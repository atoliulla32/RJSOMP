/* =========================
   FETCH USERS
========================= */

async function fetchAndMergeData(){

    try{

        const [
            volSnap,
            donSnap,
            memSnap
        ] = await Promise.all([

            getDocs(collection(db,"volunteers")),

            getDocs(collection(db,"blood_donors")),

            getDocs(collection(db,"members"))

        ]);


        const usersMap = new Map();


        function processDoc(snapshot,roleName){

            snapshot.forEach(doc=>{

                const data = doc.data();

                const phone =
                    data.phone ||
                    ("NoPhone_"+doc.id);


                if(usersMap.has(phone)){

                    const existing =
                        usersMap.get(phone);


                    if(
                        !existing.roles.includes(roleName)
                    ){

                        existing.roles.push(roleName);

                    }


                    if(
                        !existing.photo &&
                        data.profileImageUrl
                    ){

                        existing.photo =
                            data.profileImageUrl;

                    }


                    if(!existing.address){

                        existing.address =
                        [
                            data.village,
                            data.upazila,
                            data.district
                        ]
                        .filter(Boolean)
                        .join(", ");

                    }

                }else{

                    const address =
                    [
                        data.village,
                        data.upazila,
                        data.district
                    ]
                    .filter(Boolean)
                    .join(", ");


                    let secretData =
                        data.secretCode ||
                        data.secretPin;


                    if(!secretData){

                        secretData =
                            phone.slice(-4);

                    }


                    const dynamicId =
                        "RJF-"+secretData;


                    usersMap.set(phone,{

                        id:doc.id,

                        name:
                            data.name ||
                            "Unknown",

                        phone:phone,

                        blood:
                            data.bloodGroup ||
                            "N/A",

                        address:address,

                        idNo:dynamicId,

                        photo:
                            data.profileImageUrl ||
                            "",

                        roles:[roleName]

                    });

                }

            });

        }


        processDoc(
            volSnap,
            "Volunteer"
        );


        processDoc(
            donSnap,
            "Blood Donor"
        );


        processDoc(
            memSnap,
            "Member"
        );


        mergedUsers =
            Array.from(usersMap.values());


        document.getElementById(
            "totalUsers"
        ).innerText =
            mergedUsers.length;


        renderUsers(mergedUsers);

    }catch(error){

        console.error(error);

        document.getElementById(
            "users-grid"
        ).innerHTML = `

            <div class="col-span-full text-center py-16">

                <i class="fas fa-triangle-exclamation text-4xl text-red-500"></i>

                <p class="font-bold text-red-600 mt-3">
                    ডাটাবেজ থেকে তথ্য আনতে সমস্যা হয়েছে!
                </p>

            </div>

        `;

    }

}

/* =========================
   SAFE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/"/g,"%22")
        .replace(/'/g,"%27");

}

        const finish=(result)=>{

/* =========================
   FALLBACK PHOTO
========================= */

function drawPhotoFallback(
    ctx,
    x,
    y,
    size
){

    ctx.save();


    ctx.beginPath();

    ctx.arc(
        x + size/2,
        y + size/2,
        size/2,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#f1f5f9";

    ctx.fill();


    ctx.strokeStyle="#ef4444";

    ctx.lineWidth=10;

    ctx.stroke();


    ctx.fillStyle="#94a3b8";

    ctx.font="bold 55px Poppins";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
        "PHOTO",
        x+size/2,
        y+size/2
    );


    ctx.restore();

}


/* =========================
   DRAW CIRCLE IMAGE
========================= */

function drawCircularImage(
    ctx,
    img,
    x,
    y,
    size
){

    ctx.save();


    ctx.beginPath();

    ctx.arc(
        x+size/2,
        y+size/2,
        size/2,
        0,
        Math.PI*2
    );

    ctx.clip();


    if(img){

        const ratio =
            Math.max(
                size/img.width,
                size/img.height
            );


        const w =
            img.width*ratio;


        const h =
            img.height*ratio;


        const dx =
            x+(size-w)/2;


        const dy =
            y+(size-h)/2;


        ctx.drawImage(
            img,
            dx,
            dy,
            w,
            h
        );

    }else{

        ctx.fillStyle="#f1f5f9";

        ctx.fillRect(
            x,
            y,
            size,
            size
        );

    }


    ctx.restore();


    /* red ring */

    ctx.beginPath();

    ctx.arc(
        x+size/2,
        y+size/2,
        size/2-5,
        0,
        Math.PI*2
    );


    ctx.strokeStyle="#ef4444";

    ctx.lineWidth=10;

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        x+size/2,
        y+size/2,
        size/2-13,
        0,
        Math.PI*2
    );


    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=4;

    ctx.stroke();

}

========================================================= */

function drawPattern(
    ctx,
    x,
    y,
    w,
    h,
    red="#ef4444",
    white="#ffffff"
){

    ctx.save();

    ctx.fillStyle=red;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    const s=38;


    for(
        let yy=y;
        yy<y+h;
        yy+=s
    ){

        for(
            let xx=x;
            xx<x+w;
            xx+=s
        ){

            ctx.fillStyle=white;

            ctx.beginPath();

            ctx.moveTo(
                xx,
                yy
            );

            ctx.lineTo(
                xx+s,
                yy
            );

            ctx.lineTo(
                xx,
                yy+s
            );

            ctx.closePath();

            ctx.fill();


            ctx.fillStyle=white;

            ctx.beginPath();

            ctx.moveTo(
                xx+s,
                yy+s
            );

            ctx.lineTo(
                xx+s,
                yy
            );

            ctx.lineTo(
                xx,
                yy+s
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    ctx.restore();

}


/* =========================================================
   TEXT WRAP
========================================================= */

function wrapText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    lineHeight,
    maxLines=null
){

    const words =
        String(text || "")
        .split(/\s+/);


    let line="";

    let lines=[];


    for(
        let n=0;
        n<words.length;
        n++
    ){

        const testLine =
            line
            ? line+" "+words[n]
            : words[n];


        const width =
            ctx.measureText(
                testLine
            ).width;


        if(
            width>maxWidth &&
            line
        ){

            lines.push(line);

            line=words[n];

        }else{

            line=testLine;

        }

    }


    if(line){

        lines.push(line);

    }


    if(maxLines &&
       lines.length>maxLines){

        lines=lines.slice(
            0,
            maxLines
        );

        let last =
            lines[lines.length-1];


        while(
            ctx.measureText(
                last+"..."
            ).width>maxWidth &&
            last.length>0
        ){

            last=
                last.slice(
                    0,
                    -1
                );

        }


        lines[lines.length-1]
            =last+"...";

    }


    lines.forEach(
        (l,i)=>{

            ctx.fillText(
                l,
                x,
                y+i*lineHeight
            );

        }
    );


    return lines.length;

}

async function createFrontCard(){

        canvas.getContext(
            "2d"
        );

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
        0,
        0,
        680,
        1060
    );


    /* LEFT PATTERN */

    drawPattern(
        ctx,
        0,
        0,
        205,
        1060
    );


    /* logo */

    const logo =
        await loadImage(
            LOGO_URL

    if(logo){

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            105,
            135,
            65,
            0,
            Math.PI*2

        ctx.fillStyle="#ffffff";

        ctx.fill();

        ctx.clip();

                130/logo.width,
                130/logo.height

        const lh =

/* =========================================================
   DOWNLOAD BLOB
========================================================= */

function downloadCanvas(
    canvas,
    filename
){

    return new Promise((resolve,reject)=>{

        try{

            canvas.toBlob(
                blob=>{

                    if(!blob){

                        reject(
                            new Error(
                                "Canvas blob তৈরি হয়নি"
                            )
                        );

                        return;

                    }


                    const url =
                        URL.createObjectURL(
                            blob
                        );


                    const a =
                        document.createElement(
                            "a"
                        );


                    a.href=url;

                    a.download=filename;

                    a.style.display="none";


                    document.body.appendChild(a);


                    a.click();


                    setTimeout(()=>{

                        a.remove();

                        URL.revokeObjectURL(
                            url
                        );

                        resolve();

                    },1200);

                },
                "image/jpeg",
                0.95
            );

        }catch(error){

            reject(error);

        }

    });

}

window.downloadCards=async function(){

        document.getElementById(
            "downloadImgBtn"

    const originalHTML =
        btn.innerHTML;


    if(btn.disabled)return;


    btn.disabled=true;


    btn.innerHTML=`

        <i class="fas fa-spinner fa-spin"></i>

        কার্ড তৈরি হচ্ছে...

    `;


    try{

        /*
         * এখানে html2canvas ব্যবহার করা হচ্ছে না।
         * সরাসরি Canvas তৈরি হচ্ছে।
         */

        await document.fonts.ready;


        btn.innerHTML=`

            <i class="fas fa-spinner fa-spin"></i>

            Front কার্ড তৈরি হচ্ছে...

        `;

        btn.innerHTML=`

        `;


        const name =
            document
            .getElementById("edit_name")
            .value
            .trim()
            .replace(/[\\/:*?"<>|]/g,"_")
            || "Member";


        await downloadCanvas(
            front,
            "ID_Front_"+name+".jpg"
        );


        btn.innerHTML=`

            <i class="fas fa-spinner fa-spin"></i>

            Back কার্ড তৈরি হচ্ছে...

        `;


        const back =
            await createBackCard();


        btn.innerHTML=`

            <i class="fas fa-spinner fa-spin"></i>

            Back ডাউনলোড হচ্ছে...

        `;


        await downloadCanvas(
            back,
            "ID_Back_"+name+".jpg"
        );


        btn.innerHTML=`

            <i class="fas fa-check"></i>

            ডাউনলোড সম্পন্ন হয়েছে

        `;


        setTimeout(()=>{

            btn.innerHTML=originalHTML;

        },2000);


    }catch(error){

        console.error(
            "CARD DOWNLOAD ERROR:",
            error
        );


        alert(
            "❌ কার্ড তৈরি করতে সমস্যা হয়েছে।\n\n"+
            "তবে এবার সমস্যাটি কোথায় হয়েছে তা Console-এ দেখা যাবে।"
        );


        btn.innerHTML=originalHTML;

    }


    btn.disabled=false;

};

    const textToCopy =

`🩸 রক্তযোদ্ধা আইডি কার্ডের তথ্য 🩸

👤 নাম: ${name}

🏷 পদবী: ${role}

📞 মোবাইল: ${phone}

📍 ঠিকানা: ${address}

🖋 সভাপতি: ${pres}`;


    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard
        .writeText(textToCopy)
        .then(()=>{

            alert(
                "✅ আইডি কার্ডের তথ্য কপি হয়েছে!"
            );

        })
        .catch(()=>{

            fallbackCopy(textToCopy);

        });

    }else{

        fallbackCopy(textToCopy);

    }

};


function fallbackCopy(text){

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value=text;

    textarea.style.position="fixed";

    textarea.style.opacity="0";


    document.body.appendChild(
        textarea
    );


    textarea.select();


    try{

        document.execCommand(
            "copy"
        );


        alert(
            "✅ আইডি কার্ডের তথ্য কপি হয়েছে!"
        );

    }catch(e){

        alert(
            "❌ তথ্য কপি করা যায়নি।"
        );

    }


    textarea.remove();

}
