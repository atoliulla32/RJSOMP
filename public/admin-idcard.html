/* =====================================================
   LOAD USERS
   ===================================================== */

async function fetchAndMergeData(){

    try{

        const volSnap =
            await getDocs(collection(db,"volunteers"));

        const donSnap =
            await getDocs(collection(db,"blood_donors"));

        const memSnap =
            await getDocs(collection(db,"members"));


        const usersMap = new Map();


        function processDoc(snapshot,roleName){

            snapshot.forEach(docSnap => {

                const data = docSnap.data();

                const phone =
                    data.phone ||
                    "NoPhone_" + docSnap.id;


                if(usersMap.has(phone)){

                    const existing =
                        usersMap.get(phone);


                    if(!existing.roles.includes(roleName)){

                        existing.roles.push(roleName);

                    }


                    if(
                        !existing.photo &&
                        data.profileImageUrl
                    ){

                        existing.photo =
                            data.profileImageUrl;

                    }


                    if(!existing.address){

                        existing.address =
                            [
                                data.village,
                                data.upazila,
                                data.district
                            ]
                            .filter(Boolean)
                            .join(", ");

                    }

                }else{

                    const fullAddress =
                        [
                            data.village,
                            data.upazila,
                            data.district
                        ]
                        .filter(Boolean)
                        .join(", ");


                    let secretData =
                        data.secretCode ||
                        data.secretPin;


                    if(!secretData){

                        secretData =
                            phone.slice(-4);

                    }


                    const dynamicId =
                        "RJF-" + secretData;


                    usersMap.set(phone,{

                        id:docSnap.id,

                        name:
                            data.name || "Unknown",

                        phone:phone,

                        blood:
                            data.bloodGroup || "N/A",

                        address:
                            fullAddress,

                        idNo:
                            dynamicId,

                        photo:
                            data.profileImageUrl ||
                            "https://via.placeholder.com/300",

                        roles:
                            [roleName]

                    });

                }

            });

        }


        processDoc(volSnap,"Volunteer");

        processDoc(donSnap,"Blood Donor");

        processDoc(memSnap,"Member");


        mergedUsers =
            Array.from(usersMap.values());


        document.getElementById("totalUsers")
            .innerText =
            mergedUsers.length;


        renderUsers(mergedUsers);

    }

    catch(error){

        console.error(error);

        document.getElementById("users-grid").innerHTML = `

            <div class="col-span-full text-center py-10 text-red-600 font-bold">

                ডাটাবেজ থেকে তথ্য আনতে সমস্যা হয়েছে!

            </div>

        `;

    }

}

/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   SEARCH
   ===================================================== */

window.filterUsers = function(){

    const txt =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        mergedUsers.filter(u =>

            String(u.name || "")
                .toLowerCase()
                .includes(txt)

            ||

            String(u.phone || "")
                .includes(txt)

            ||

            String(u.idNo || "")
                .toLowerCase()
                .includes(txt)

        );


    renderUsers(filtered);

};

            function(e){

        reader.readAsDataURL(
            input.files[0]
        );

    }

};


/* =====================================================
   IMAGE LOAD WAIT
   ===================================================== */

function waitForImage(img,timeout=7000){

    return new Promise(resolve => {

        if(!img){

            resolve(false);

            return;

        }


        if(img.complete){

            resolve(
                img.naturalWidth > 0
            );

            return;

        }


        let finished = false;


        const done = (result) => {

            if(finished) return;

            finished = true;

            resolve(result);

        };


        img.onload =
            () => done(true);


        img.onerror =
            () => done(false);


        setTimeout(
            () => done(false),
            timeout
        );

    });

}

    try{

           document.fonts.ready){

                new Promise(resolve =>
                    setTimeout(resolve,4000)
                )

            ]);

        }

    }catch(e){}

}

/* =====================================================
   SAFE HTML2CANVAS
   ===================================================== */

async function renderCard(element){

    if(!element){

        throw new Error("Card element not found");

    }


    /*
       Force browser layout
    */

    element.style.display = "block";


    await waitForFonts();


    /*
       Give browser time to paint
    */

    await new Promise(resolve =>
        requestAnimationFrame(() =>
            requestAnimationFrame(resolve)
        )
    );


    const options = {

        scale:2,

        useCORS:true,

        allowTaint:false,

        backgroundColor:
            element.id === "export-back"
            ? "#000000"
            : "#ffffff",

        logging:false,

        imageTimeout:5000,

        removeContainer:true,

        foreignObjectRendering:false

    };


    return await Promise.race([

        html2canvas(element,options),

        new Promise((resolve,reject) => {

            setTimeout(() => {

                reject(
                    new Error(
                        "Card rendering timeout"
                    )
                );

            },15000);

        })

    ]);

}


/* =====================================================
   DOWNLOAD IMAGE – ANDROID FRIENDLY
   ===================================================== */

function downloadCanvas(canvas,fileName){

    return new Promise((resolve,reject) => {

        try{

            canvas.toBlob(function(blob){

                if(!blob){

                    reject(
                        new Error(
                            "Image conversion failed"
                        )
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(blob);


                const link =
                    document.createElement("a");


                link.href = url;

                link.download = fileName;

                link.style.display = "none";


                document.body.appendChild(link);


                link.click();


                setTimeout(() => {

                    document.body.removeChild(link);

                    URL.revokeObjectURL(url);

                    resolve();

                },1200);


            },"image/jpeg",0.98);

        }

        catch(error){

            reject(error);

        }

    });

}

        /*

        await downloadCanvas(
            canvasFront,
            `ID_Front_${safeName}.jpg`
        );


        /*
           Give Android browser time
        */

        await new Promise(resolve =>
            setTimeout(resolve,1200)
        );


        /*
           Back download
        */

        await downloadCanvas(
            canvasBack,
            `ID_Back_${safeName}.jpg`
        );


        /*
           SUCCESS
        */

        btn.innerHTML = `

            <i class="fas fa-check-circle"></i>

            ডাউনলোড সম্পন্ন হয়েছে

        `;


        setTimeout(() => {

            btn.innerHTML = oldHTML;

        },2500);

    }


    catch(error){

        console.error(
            "ID CARD ERROR:",
            error
        );


        alert(
            "❌ কার্ড তৈরি করতে সমস্যা হয়েছে।\n\n" +
            "সম্ভবত সদস্যের ছবি বা লোগো লোড হতে সমস্যা হয়েছে।\n\n" +

    finally{

                );

        }

    }

/* =====================================================
   FALLBACK COPY
   ===================================================== */

function fallbackCopy(text){

    const textArea =
        document.createElement("textarea");


    textArea.value =
        text;


    textArea.style.position =
        "fixed";


    textArea.style.left =
        "-9999px";


    document.body.appendChild(
        textArea
    );


    textArea.focus();

    textArea.select();


    try{

        document.execCommand(
            "copy"
        );


        alert(
            "✅ আইডি কার্ডের সব তথ্য কপি করা হয়েছে!"
        );

    }

    catch(error){

        alert(
            "❌ তথ্য কপি করা সম্ভব হয়নি।"
        );

    }


    document.body.removeChild(
        textArea
    );

}
