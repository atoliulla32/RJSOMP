/* =====================================================
   FETCH DATA
===================================================== */
async function fetchAndMergeData(){
    try{
        const volSnap = await getDocs(collection(db,"volunteers"));
        const donSnap = await getDocs(collection(db,"blood_donors"));
        const memSnap = await getDocs(collection(db,"members"));

        let usersMap = new Map();

        const processDoc = (docSnap,roleName)=>{
            docSnap.forEach(d=>{
                const data=d.data();
                const phone = data.phone || "NoPhone_"+d.id;

                if(usersMap.has(phone)){
                    const existing = usersMap.get(phone);
                    if(!existing.roles.includes(roleName)){ existing.roles.push(roleName); }
                    if(!existing.photo && data.profileImageUrl){ existing.photo = data.profileImageUrl; }
                    if(!existing.address){
                        existing.address = [data.village, data.upazila, data.district].filter(Boolean).join(", ");
                    }
                }
                else{
                    const fullAddress = [data.village, data.upazila, data.district].filter(Boolean).join(", ");
                    let secretData = data.secretCode || data.secretPin;
                    if(!secretData){ secretData = phone.slice(-4); }
                    const dynamicId = "RJF-"+secretData;

                    usersMap.set(phone,{
                        id:d.id,
                        name: data.name || "Unknown",
                        phone:phone,
                        blood: data.bloodGroup || "N/A",
                        address: fullAddress,
                        idNo: dynamicId,
                        photo: data.profileImageUrl || "https://via.placeholder.com/300",
                        roles: [roleName]
                    });
                }
            });
        };

        processDoc(volSnap,"Volunteer");
        processDoc(donSnap,"Blood Donor");
        processDoc(memSnap,"Member");

        mergedUsers = Array.from(usersMap.values());
        document.getElementById('totalUsers').innerText = mergedUsers.length;
        renderUsers(mergedUsers);

    }
    catch(e){
        console.error(e);
        document.getElementById('users-grid').innerHTML = `
            <div class="col-span-full text-center py-10 text-red-600 font-bold">
                ডাটাবেজ থেকে তথ্য আনতে সমস্যা হয়েছে!
            </div>
        `;
    }
}

            <button onclick="openIdModal('${safeDataStr}')" class="shrink-0 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white border border-red-200 w-10 h-10 rounded-xl flex items-center justify-center transition shadow-sm">

            </button>
        </div>
        `;
    });
    grid.innerHTML=html;
};

/* =====================================================
   HTML ESCAPE
===================================================== */
function escapeHtml(value){
    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =====================================================
   SEARCH
===================================================== */
window.filterUsers=()=>{
    const txt = document.getElementById('searchInput').value.toLowerCase();
    const filtered = mergedUsers.filter(u=>
        String(u.name).toLowerCase().includes(txt) ||
        String(u.phone).includes(txt) ||
        String(u.idNo).toLowerCase().includes(txt)
    );
    renderUsers(filtered);
};

    const u = JSON.parse(decodeURIComponent(dataStr));
    document.getElementById('edit_name').value = u.name || "";
    document.getElementById('edit_role').value = u.roles.join(", ") || "";

/* =====================================================

===================================================== */

    modal.classList.add('opacity-0');

/* =====================================================

        const reader = new FileReader();
        reader.onload=(e)=>{ document.getElementById('c_photo').src = e.target.result; };
        reader.readAsDataURL(input.files[0]);

/* =====================================================
   IMAGE TO DATA URL
===================================================== */
async function imageToDataURL(url, timeout=5000){
    if(!url){ return ""; }
    if(url.startsWith("data:")){ return url; }

    try{
        const controller = new AbortController();
        const timer = setTimeout(()=>controller.abort(), timeout);
        const response = await fetch(url, { mode:"cors", signal: controller.signal });
        clearTimeout(timer);

        if(!response.ok){ throw new Error("Image fetch failed"); }
        const blob = await response.blob();

        return await new Promise(resolve=>{
            const reader = new FileReader();
            reader.onload=()=> resolve(reader.result);
            reader.onerror=()=> resolve("");
            reader.readAsDataURL(blob);
        });
    }
    catch(error){
        console.warn("Image could not be converted:", url);
        return "";
    }
}

/* =====================================================
   WAIT FUNCTION
===================================================== */
function wait(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }

/* =====================================================
   HTML2CANVAS WITH TIMEOUT
===================================================== */
async function canvasWithTimeout(element, options, timeout=15000){
    return await Promise.race([
        html2canvas(element, options),
        new Promise((_,reject)=>{ setTimeout(()=>reject(new Error("CARD_RENDER_TIMEOUT")), timeout); })
    ]);
}

/* =====================================================
   DOWNLOAD CANVAS AS JPG
===================================================== */
function downloadCanvas(canvas, filename){
    return new Promise((resolve,reject)=>{
        canvas.toBlob((blob)=>{
            if(!blob){ reject(new Error("Blob creation failed")); return; }
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href=url; link.download=filename; link.style.display='none';
            document.body.appendChild(link);
            link.click();
            setTimeout(()=>{ link.remove(); URL.revokeObjectURL(url); resolve(); },1200);
        }, 'image/jpeg', 0.95);
    });
}

/* =====================================================
   MAIN DOWNLOAD
===================================================== */
window.processCardAction = async(actionType)=>{
    const btn = document.getElementById('downloadImgBtn');
    const originalText = btn.innerHTML;
    if(btn.disabled){ return; }

    btn.disabled=true;
    btn.innerHTML=`<i class="fas fa-spinner fa-spin"></i> কার্ড তৈরি হচ্ছে...`;

    let container=null;

    try{
        const photoUrl = document.getElementById('c_photo').src;
        let photoData="";
        if(photoUrl){ photoData = await imageToDataURL(photoUrl, 5000); }

        let logoData = await imageToDataURL(LOGO_URL, 5000);
        if(!logoData){ logoData = LOGO_URL; }

        container = document.createElement('div');
        container.style.position='fixed'; container.style.left='-100000px'; container.style.top='0';
        container.style.width='700px'; container.style.background='#fff'; container.style.zIndex='-9999';
        document.body.appendChild(container);

        container.innerHTML = getCardTemplateHTML(photoData, logoData);
        await wait(500);

        const front = container.querySelector('#export-front');
        const back = container.querySelector('#export-back');

        if(!front || !back){ throw new Error("Card elements not found"); }

        const imgs = container.querySelectorAll('img');
        await Promise.all(Array.from(imgs).map(img=>{
            if(img.complete){ return Promise.resolve(); }
            return new Promise(resolve=>{ img.onload=resolve; img.onerror=resolve; setTimeout(resolve, 3000); });
        }));

        const canvasFront = await canvasWithTimeout(front, { scale:2, useCORS:true, allowTaint:false, backgroundColor:"#ffffff", logging:false, imageTimeout:4000, removeContainer:false }, 15000);
        const canvasBack = await canvasWithTimeout(back, { scale:2, useCORS:true, allowTaint:false, backgroundColor:"#000000", logging:false, imageTimeout:4000, removeContainer:false }, 15000);

        const gap=40;
        const combinedCanvas = document.createElement("canvas");
        combinedCanvas.width = canvasFront.width + canvasBack.width + gap*2;
        combinedCanvas.height = Math.max(canvasFront.height, backCanvas.height) + gap*2;

        const ctx = combinedCanvas.getContext("2d");
        ctx.fillStyle="#fce8e5";
        ctx.fillRect(0, 0, combinedCanvas.width, combinedCanvas.height);
        ctx.drawImage(canvasFront, gap, gap);
        ctx.drawImage(canvasBack, canvasFront.width + gap*2, gap);

        const userName = document.getElementById('edit_name').value.trim().replace(/[\\/:*?"<>|]/g,"_");
        const fileName = `Rokttojoddha_ID_Card_${userName || "Member"}.jpg`;

        const dataURL = combinedCanvas.toDataURL("image/jpeg", 0.95);
        const blob = await (await fetch(dataURL)).blob();
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href=blobUrl; link.download=fileName; link.style.display="none";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(()=>{ URL.revokeObjectURL(blobUrl); }, 3000);

        btn.innerHTML=`<i class="fas fa-check-circle"></i> ডাউনলোড সম্পন্ন হয়েছে`;
        setTimeout(()=>{ btn.innerHTML=originalText; }, 2000);

    }catch(error){
        console.error("ID CARD DOWNLOAD ERROR:", error);
        let message = "কার্ড তৈরি করতে সমস্যা হয়েছে।";
        if(error.message === "CARD_RENDER_TIMEOUT"){ message = "কার্ড তৈরি হতে বেশি সময় লাগছে। আবার চেষ্টা করুন।"; }
        alert("❌ "+message+"\n\nসমস্যা হলে Chrome ব্রাউজার দিয়ে আবার চেষ্টা করুন।");
        btn.innerHTML=`<i class="fas fa-redo"></i> আবার চেষ্টা করুন`;
        setTimeout(()=>{ btn.innerHTML=originalText; }, 3000);
    }finally{
        btn.disabled=false;
        if(container){ try{ container.remove(); }catch(e){} }
    }
};
